# The wheel a project installs (`pip install blastit`, `uv add blastit`).
#
# One universal Rust binary (`crates/blastit`) plus a pure-stdlib Python package
# (`python/blastit`) whose every console script ends in one `os.execvpe` of it,
# so the same wheel runs on every CPython `>=3.12` with no per-minor artifact.
#
# **Two stages, one artifact family (`MB.42.3`, design §6.1).** `maturin build
# --bindings bin` produces a wheel whose only payloads are the `blastit` binary
# (in `<name>.data/scripts/`) and the Python package; `scripts/repack_universal_wheel.py`
# then relocates that binary beside `blastit-lsp` and the PHP/Python shims under
# `blastit/_bin/`, writes the three console scripts, sets `Root-Is-Purelib:
# false` and retags the file `py3-none-<platform>`. Four wheels, one per
# `{arch} x {libc}`, serve CPython 3.12, 3.13 and 3.14 alike.
#
# The backend is maturin's own: `maturin build` is what `scripts/build-wheel.sh`
# and CI run, and a PEP 517 build (`pip install .`, `uv sync`, and every
# `pip install blastit` that falls back to the sdist) does exactly the same thing.
# One program makes that enough — the universal binary plays every role, the
# credentials-holding one included (`--role=dbproxy`), so no second artifact has
# to be built in front of maturin.
[build-system]
# 1.9.3 is the first release that carries `license-files` into the sdist, which
# is where a source install reads them from (§ E4).
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "blastit"
description = "A sandboxing WSGI server: uids, per-route database grants, and no framework integration"
readme = "README.md"
# `>=3.12`: the wheel is `py3-none-*` and carries no extension, so the CLI
# (`blastit`, `check`, `fmt`, `lsp`) runs on 3.12 exactly as on 3.13/3.14.
# WSGI *views* still need 3.13/3.14 (a per-minor shim, §1) and refuse on 3.12
# with the support sentence.
requires-python = ">=3.12"
# SPDX expression (PEP 639), with the file it names; the Apache 2.0 text is at
# `LICENSE`, and PEP 639 says a project with a license expression must not also
# carry a `License ::` classifier.
license = "Apache-2.0"
license-files = ["LICENSE"]
# Both from `git log`, the only authorship record there is: no other name or
# address appears in the repository or in the LICENSE.
authors = [{ name = "Rémy Sanchez", email = "remy.sanchez@hyperthese.net" }]
maintainers = [{ name = "Rémy Sanchez", email = "remy.sanchez@hyperthese.net" }]
keywords = ["wsgi", "server", "sandbox", "security", "privilege-separation", "postgresql", "django"]
dynamic = ["version"]
classifiers = [
    # 0.1 is the first public release, `blastit.toml` may still change, and the
    # README says pre-release: Alpha, not Beta.
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    # Linux only: the sandboxes are uids, seccomp and `execve` (§7).
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # The wheel carries no extension: it is `py3-none-*` and every CPython
    # `>=3.12` loads the same bytes (design §6.1).
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
]
# No Python dependency at all: the server is the extension, and the CLI imports
# nothing but the standard library.
dependencies = []

# The two console scripts the wheel installs (`blastit`, `blastit-lsp`, design
# §6.1) are written by `scripts/repack_universal_wheel.py` into the repacked
# `*.dist-info/entry_points.txt`, **not** declared here as `[project.scripts]`:
# maturin refuses that combination outright ("Defining scripts and working with a
# binary doesn't mix well", checked against `maturin 1.9`), and the bin-binding
# build is what makes the artifact interpreter-free. The repack is the second
# stage of the same build, so the two names have exactly one owner
# (`CONSOLE_SCRIPTS` in that script) and `scripts/test_packaging_gates.py` checks
# each target is importable.
#
# Until `MB.42.3` a `bindings = "bin"` wheel put the binary in the interpreter's
# `bin/` and shipped none of them; the repack relocates it to `blastit/_bin/`
# (where `blastit._blastit` looks first) and restores them.

[project.urls]
Homepage = "https://github.com/OffworldNexus/blastit"
Documentation = "https://offworldnexus.github.io/blastit/"
Source = "https://github.com/OffworldNexus/blastit"
Issues = "https://github.com/OffworldNexus/blastit/issues"
Changelog = "https://github.com/OffworldNexus/blastit/blob/develop/CHANGELOG.md"

[tool.maturin]
# The universal binary is the wheel's program (`bindings = "bin"`): the Python
# package is a bridge to it, not an extension. A `bin` binding needs no
# interpreter at build time, which is what makes one artifact portable.
manifest-path = "crates/blastit/Cargo.toml"
bindings = "bin"
python-source = "python"
# The wheel carries one program under `blastit/_bin/` — `blastit`, which runs the
# credentials-holding role as `--role=dbproxy` — and nothing has to be staged
# into the package before maturin runs. The `include` list below is the sdist's
# cargo tree and nothing else.
include = [
    # **Every** workspace member, not just the graph `crates/blastit` reaches.
    # The workspace is `members = ["crates/*"]`, and a source install builds the
    # sdist's `crates/blastit` with cargo, which resolves the whole workspace
    # first. Two members no shipped binary depends on — `blastit-py-shim` (the
    # per-minor cdylib `make py-sapi` builds) and `blastit-view-python` (which
    # only that shim links) — are not on that graph, so maturin's walk drops them
    # and `cargo metadata --locked` dies before the build starts with "cannot
    # update the lock file because --locked was passed". The glob keeps a future
    # member in the sdist without a second edit here.
    #
    # An `include` glob is **not** `.gitignore`-filtered (unlike maturin's walk
    # of `python-source`): from a dirty checkout the same glob would carry
    # `crates/*/target`, `__pycache__` and profiler output into the sdist — and
    # those reach `pip install .` here and every local rehearsal. Hence the
    # `exclude` list below, which is the price of the glob.
    { path = "crates/**/*", format = "sdist" },
]

exclude = [
    # A directories' *contents* need `/**` here: a bare `crates/**/target` does
    # not drop the files underneath it (checked against maturin 1.16).
    { path = "crates/**/target/**", format = "sdist" },
    { path = "crates/**/__pycache__/**", format = "sdist" },
    { path = "crates/**/.venv/**", format = "sdist" },
    { path = "crates/**/*.profraw", format = "sdist" },
]
