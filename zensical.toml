# blastit's documentation site (E2).
#
# Build it with `uvx zensical build --strict`, preview it with
# `uvx zensical serve`. `docs_dir` is `docs/` — the same tree the rest of the
# repository already links into — and `exclude_docs` keeps the material that is
# not a page out of the build. See `docs-site-plan.md` for why.
[project]
site_name = "blastit"
site_url = "https://offworldnexus.github.io/blastit/"
site_description = "A sandboxing WSGI server: one process and one uid per route, secrets kept out of the app, and only the grants each route needs."
site_author = "Offworld Nexus"
copyright = "&copy; 2026 Offworld Nexus &middot; Apache 2.0"

repo_url = "https://github.com/OffworldNexus/blastit"
repo_name = "OffworldNexus/blastit"
edit_uri = "edit/develop/docs/"

docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Fit it to your framework" = [
    "frameworks/index.md",
    { "Django" = "frameworks/django.md" },
    { "Flask and other WSGI apps" = "frameworks/flask.md" },
    { "Day-to-day life" = "frameworks/day-to-day.md" },
  ] },
  { "Fit it to your infra" = [
    "infra/index.md",
    { "DigitalOcean App Platform" = "infra/digitalocean-paas.md" },
    { "Docker Compose behind Traefik" = "infra/compose-traefik.md" },
    { "Anything else" = "infra/anything-else.md" },
    { "Fair queuing" = "infra/fair-queuing.md" },
  ] },
  { "Reference" = [
    "reference/settings.md",
    { "Command line" = "reference/cli.md" },
    { "The manifest" = "reference/manifest.md" },
    { "Log events" = "reference/log-events.md" },
    { "pytest plugin" = "reference/pytest-plugin.md" },
  ] },
  { "How it works" = "how-it-works.md" },
  { "Security model" = "security.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Changelog" = "changelog.md" },
]

extra_css = ["brand/brand.css", "stylesheets/extra.css"]

# `archive/` and `spikes/` are working material, not pages, and so are the brand
# files a human works with rather than reads. Everything else under `brand/` is
# published, because the site serves it: the logo, the favicons, the social
# card.
exclude_docs = """
/archive/
/spikes/
/brand/mascot-artwork.md
/brand/check_seams.py
/brand/mascot-compare.png
/brand/mascot-reference.png
/brand/mascot-side-by-side.png
"""

[project.theme]
language = "en"
logo = "brand/logo.svg"
favicon = "brand/favicon.svg"
custom_dir = "overrides"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "toc.follow",
]

[project.theme.icon]
edit = "material/pencil"
view = "material/eye"

# The nuthatch palette lives in `docs/brand/brand.css`, which needs `custom` on
# both entries to be the one that defines the colours (E3).
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# A broken link or a link to a missing anchor fails `--strict`, which is what
# `.github/workflows/docs.yml` runs.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
