[package]
name = "blastit-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blastit-events = { version = "0.1.0", path = "../blastit-events" }
blastit-frame = { version = "0.1.0", path = "../blastit-frame" }
blastit-manifest = { version = "0.1.0", path = "../blastit-manifest" }
rustix = { version = "1.1.5", features = ["net", "process", "fs"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
