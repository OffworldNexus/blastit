[package]
name = "blastit-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The root `pyproject.toml` says `module-name = "blastit._blastit"`, which puts
# this artifact at `blastit/_blastit.<abi>.so`; a lib target's name is the last
# component of the module's name.
name = "_blastit"
crate-type = ["cdylib"]

[features]
# `pyo3/extension-module`, i.e. "the symbols come from the interpreter that
# loads me": the wheel's extension must not link `libpython` (the interpreter
# already has it, and an auditwheel-compliant wheel cannot depend on it).
#
# It is deliberately *not* a default feature, and no dependency of this package
# enables it: cargo unifies a package's features across a whole build graph, so
# with it on, the standalone `blastit` binary — the same workspace, and the one
# program that embeds CPython and must link `libpython` — would not link.
# `scripts/build-wheel.sh` enables it, and only there.
extension-module = ["pyo3/extension-module"]

[dependencies]
# The wheel is the artifact that *carries* the interpreter, so it is the one
# place that turns `blastit`'s `python` capability on (`ADR-0010` §4: wheels are
# `python, php, static`, the standalone archive is `php, static`). Enabling it
# here rather than in `blastit`'s defaults is what keeps `cargo build -p blastit`
# free of `libpython` and of a `RUNPATH` into the build host's uv cache (`MB.17`),
# and it is also what a from-source `pip install .` gets: that path builds *this*
# crate and passes no `--features` at all. `php` and `static` come from
# `blastit`'s defaults, which a feature edge adds to instead of replacing; the
# wheel therefore serves a `static` mount as well as a PHP route (`MB.36.6`).
#
# Cargo unifies features across a build graph, so a workspace-wide `cargo build`
# (no `-p`) does still link `libpython` into `target/debug/blastit` because this
# member asks for the capability. Build or ship the binary with `-p blastit`
# (`make rs-no-python`, and the `standalone` job in `ci.yml`), never with
# `--workspace`; `docs/knowledge/LESSONS.md` records the trap.
blastit = { version = "0.2.0", path = "../blastit", features = ["python"] }
# The audit behind the pytest plugin (D3b) is thrown together by Python and
# answered by blastit itself. That answer — the grant diff, the observations
# schemas and the `Blastfile` reader/writer — is `blastit-audit`'s, so this
# extension is a binding and not a second implementation (`MB.42.2.2.1`).
blastit-audit = { version = "0.2.0", path = "../blastit-audit" }
pyo3 = { version = "0.30.1" }
# The observations come in as JSON and the report goes out as JSON: whatever
# writes the plugin's reports is not Rust, and a hand-rolled encoder is one
# escaping bug away from writing a broken report. `serde_json` is already part
# of this workspace at this version.
serde_json = "1.0.154"

[dev-dependencies]
# Only the protected `critical_check_schema` suite reads the manifest crate
# directly (it applies a planned edit through the one writer); the extension
# itself reaches the manifest through `blastit-audit`.
blastit-manifest = { version = "0.2.0", path = "../blastit-manifest" }
