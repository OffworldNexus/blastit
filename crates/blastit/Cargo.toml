[package]
name = "blastit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "blastit"
path = "src/main.rs"

[dependencies]
blastit-dbproxy = { version = "0.1.0", path = "../blastit-dbproxy" }
blastit-env = { version = "0.1.0", path = "../blastit-env" }
blastit-events = { version = "0.1.0", path = "../blastit-events" }
blastit-frame = { version = "0.1.0", path = "../blastit-frame" }
blastit-http = { version = "0.1.0", path = "../blastit-http" }
blastit-manifest = { version = "0.1.0", path = "../blastit-manifest" }
blastit-scheduler = { version = "0.1.0", path = "../blastit-scheduler" }
blastit-sys = { version = "0.1.0", path = "../blastit-sys" }
blastit-view = { version = "0.1.0", path = "../blastit-view" }
libc = "0.2.191"
pyo3 = "0.30.1"
rustix = { version = "1.1.5", features = ["event", "fs", "process", "net", "pipe", "stdio"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
