[package]
name = "blastit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "blastit"
path = "src/main.rs"

[features]
# A plain `cargo build -p blastit` is the **standalone** artifact (ADR-0010 §4):
# `php` needs nothing at link time, while `python` would link `libpython` and a
# `RUNPATH` into the build host's interpreter cache — a binary that only runs in
# the checkout that produced it (`MB.17`). The wheel opts in to `python`
# explicitly through `crates/blastit-py/Cargo.toml`, and every `make` target that
# needs an interpreter passes the feature, so WSGI coverage never disappears by
# default.
default = ["php"]
# Every embedded-CPython role: the `BLASTIT_APP` import, the WSGI views, the
# immortalisation pass and `blastit dev --learn`. Off in the standalone archive,
# which carries no `libpython` and refuses a manifest that needs an interpreter
# (ADR-0010 §4, `MB.3.11`).
python = ["dep:pyo3", "blastit-view/python"]
# Embedded PHP routes (`[route.php]`, ADR-0010). `libphp` is never linked: a
# view `dlopen`s the host's NTS library and the per-minor shim, and the loader
# that does it lives in `blastit-php-sapi`. The standalone binary therefore
# carries no `DT_NEEDED` on `libphp` (`make rs-no-python`).
php = ["blastit-view/php", "dep:blastit-php-sapi"]

[dependencies]
blastit-dbproxy = { version = "0.2.0", path = "../blastit-dbproxy" }
blastit-env = { version = "0.2.0", path = "../blastit-env" }
blastit-events = { version = "0.2.0", path = "../blastit-events" }
blastit-frame = { version = "0.2.0", path = "../blastit-frame" }
blastit-http = { version = "0.2.0", path = "../blastit-http" }
blastit-ingress = { version = "0.2.0", path = "../blastit-ingress" }
blastit-manifest = { version = "0.2.0", path = "../blastit-manifest" }
blastit-php-sapi = { version = "0.2.0", path = "../blastit-php-sapi", optional = true }
blastit-scheduler = { version = "0.2.0", path = "../blastit-scheduler" }
blastit-sqlpolicy = { version = "0.2.0", path = "../blastit-sqlpolicy" }
blastit-sys = { version = "0.2.0", path = "../blastit-sys" }
blastit-view = { version = "0.2.0", path = "../blastit-view", default-features = false }
libc = "0.2.191"
pyo3 = { version = "0.30.1", optional = true }
rustix = { version = "1.1.5", features = ["event", "fs", "process", "net", "pipe", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
