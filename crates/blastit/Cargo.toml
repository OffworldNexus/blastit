[package]
name = "blastit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "blastit"
path = "src/main.rs"

[features]
# A plain `cargo build -p blastit` is the **standalone** artifact (ADR-0010 §4):
# `php` and `static` need nothing at link time, while `python` would link
# `libpython` and a `RUNPATH` into the build host's interpreter cache — a binary
# that only runs in the checkout that produced it (`MB.17`). The wheel opts in to
# `python` explicitly through `crates/blastit-py/Cargo.toml`, and every `make`
# target that needs an interpreter passes the feature, so WSGI coverage never
# disappears by default.
default = ["php", "static"]
# Every embedded-CPython role: the `BLASTIT_APP` import, the WSGI views, the
# immortalisation pass and `blastit dev --learn`. Off in the standalone archive,
# which carries no `libpython` and refuses a manifest that needs an interpreter
# (ADR-0010 §4, `MB.3.11`). The WSGI worker itself is `blastit-view-python`, a
# crate of its own: the feature pulls it (and `pyo3`) in, and nothing else can.
python = ["dep:pyo3", "dep:blastit-view-python"]
# Embedded PHP routes (`entrypoint php`, ADR-0010). `libphp` is never linked: a
# view `dlopen`s the host's NTS library and the per-minor shim, and the loader
# that does it is `blastit-php-sapi`'s, reached through `blastit-view-php`. The
# standalone binary therefore carries no `DT_NEEDED` on `libphp`
# (`make rs-no-python`), and a build without this feature carries no discovery
# gate either: it refuses an `entrypoint php` with one sentence (`R13`).
php = ["dep:blastit-view-php"]
# File-serving routes (`static "<prefix>"`, ARCHITECTURE.md §9.2). On by
# default: a manifest with a mount must serve, and a build that leaves this
# off refuses that manifest at boot (`SchedulerError::StaticNotCompiled`)
# instead of linking the responder. `blastit-scheduler` is pulled in with
# `default-features = false` so this one line, and not a dependency default,
# is what decides whether the static responder is in the binary.
static = ["blastit-scheduler/static"]

[dependencies]
blastit-dbproxy = { version = "0.2.0", path = "../blastit-dbproxy" }
blastit-env = { version = "0.2.0", path = "../blastit-env" }
blastit-events = { version = "0.2.0", path = "../blastit-events" }
blastit-frame = { version = "0.2.0", path = "../blastit-frame" }
blastit-http = { version = "0.2.0", path = "../blastit-http" }
blastit-ingress = { version = "0.2.0", path = "../blastit-ingress" }
blastit-lsp = { version = "0.2.0", path = "../blastit-lsp" }
blastit-manifest = { version = "0.2.0", path = "../blastit-manifest" }
# The PHP half of a view (`MB.36.5`): the embedded worker, the boot's discovery
# gate, the `(st_dev, st_ino)` pins and the probe child. Optional, so a build
# without `php` links neither this nor `blastit-php-sapi` (`R13`).
blastit-view-php = { version = "0.2.0", path = "../blastit-view-php", optional = true }
blastit-scheduler = { version = "0.2.0", path = "../blastit-scheduler", default-features = false }
blastit-sqlpolicy = { version = "0.2.0", path = "../blastit-sqlpolicy" }
blastit-sys = { version = "0.2.0", path = "../blastit-sys" }
blastit-view = { version = "0.2.0", path = "../blastit-view", default-features = false }
# The embedded-CPython worker (`MB.36.3`): PEP 3333, `wsgi.input`, the response
# frames and the worker pool, behind the `python` feature. A build without that
# feature does not link this crate, and therefore not `libpython` either.
blastit-view-python = { version = "0.2.0", path = "../blastit-view-python", optional = true }
libc = "0.2.191"
pyo3 = { version = "0.30.1", optional = true }
rustix = { version = "1.1.5", features = ["event", "fs", "process", "net", "pipe", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
