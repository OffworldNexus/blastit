[package]
name = "blastit-dbproxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
blastit-events = { version = "0.1.0", path = "../blastit-events" }
blastit-sqlpolicy = { version = "0.1.0", path = "../blastit-sqlpolicy" }
pregresql = { git = "https://github.com/OffworldNexus/pregresql", rev = "e00e74751605193b249db31b6ea546c1522ad76a" }
rustix = { version = "1.1.5", features = ["net", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tokio-postgres = "0.7.18"
