[package]
name = "blastit-view-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blastit-frame = { version = "0.2.0", path = "../blastit-frame" }
# The child sequence (`enter`), the fork's `Fork` and the limits a view child
# runs under: the WSGI fork composes them here, and `blastit-sys` is the crate
# that owns their order (design §4.4 D1).
blastit-sys = { version = "0.2.0", path = "../blastit-sys" }
# The `view.chan` transport: frames, credit windows and the loaded-file codec.
# This crate is the interpreter half of a view, never a second framing.
blastit-view = { version = "0.2.0", path = "../blastit-view", default-features = false }
# No `auto-initialize`: a view process is forked from an interpreter that
# `init` has already initialised (§4, §9.3), and library code must never
# start or stop one.
pyo3 = "0.30.1"

[dev-dependencies]
# The tests own the interpreter: they attach to it themselves, and
# `auto-initialize` is what lets them (see `tests/gil.rs`).
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
# `immortal`'s child reports are JSON lines the parent parses: the same shape
# the boot event uses, so a failure names the count that moved.
serde_json = "1.0.154"
