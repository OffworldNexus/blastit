[package]
name = "blastit-py-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The per-minor `libblastit_py3{13,14}-<arch>-<libc>.so` a universal `blastit`
# `dlopen`s after the host's `libpython` (design `universal-distribution.md`
# §1.1). A `cdylib` so the artifact exists, and an `rlib` so the same crate is
# unit-testable without loading it.
[lib]
name = "blastit_py_shim"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The one switch `make py-sapi` passes: pyo3 then links no `libpython` and every
# `Py*` call is an `UND` symbol resolved by the library `dlopen`ed first. None of
# this reaches `crates/blastit`: it depends on `blastit-py-sapi`, never here.
extension-module = ["pyo3/extension-module"]

[dependencies]
# The frozen `#[repr(C)]` surface (`abi`) this crate *implements*: one spelling
# of the ten slots, shared with the loader that reads them.
blastit-py-sapi = { version = "0.2.0", path = "../blastit-py-sapi" }
# `child::panic_message`, for the one sentence a caught panic becomes.
blastit-sys = { version = "0.2.0", path = "../blastit-sys" }
# `Limits`: the `view.chan` frame ceiling a view process is told about (§3.1).
blastit-frame = { version = "0.2.0", path = "../blastit-frame" }
# The loaded-file datagram and its codec: the boot batch a `dev` view reports.
blastit-view = { version = "0.2.0", path = "../blastit-view", default-features = false }
# The interpreter half: `serve_reporting`, `immortal`, `LoadedTracker`,
# `LoadedReporter` and the `WsgiConfig` a view process is told about.
blastit-view-python = { version = "0.2.0", path = "../blastit-view-python" }
pyo3 = "0.30.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
