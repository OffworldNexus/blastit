[package]
name = "blastit-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# No WSGI feature and no default feature: the framing, the credit windows and
# the loaded-file codec are plain `std` and always compiled, while the
# embedded CPython worker is `blastit-view-python` — a crate of its own — so a
# `--workspace` build or another crate's defaults can no longer drag
# `libpython` into an artifact that serves no WSGI route
# (`docs/knowledge/LESSONS.md` `MB.17`, `ADR-0016`).
default = []
# Embedded PHP: `PhpEmbedRuntime` over the same `view.chan` framing. It needs
# `libphp` only through `dlopen` inside the worker (`MB.3.13`), so this feature
# adds no link-time dependency and the standalone binary stays portable.
# `MB.36.5` moves `php.rs` into `blastit-view-php` and deletes this line.
php = ["dep:blastit-php-sapi"]

[dependencies]
blastit-frame = { version = "0.2.0", path = "../blastit-frame" }
# The frozen `blastit_php_abi_v1` surface and the one `dlopen` module. Optional:
# a build with no PHP route pays for neither.
blastit-php-sapi = { version = "0.2.0", path = "../blastit-php-sapi", optional = true }
thiserror = "2.0.21"
