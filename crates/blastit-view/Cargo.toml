[package]
name = "blastit-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["python"]
# The PEP 3333 bridge and the `serve` loop that runs a WSGI callable. A build
# that serves no WSGI route leaves it off and links no `libpython` at all; the
# channel framing (`wire`, `flow`) stays compiled either way because it is the
# worker transport, not the interpreter binding (ADR-0010 §4, `MB.3.11`).
python = ["dep:pyo3"]

[dependencies]
blastit-frame = { version = "0.2.0", path = "../blastit-frame" }
# No `auto-initialize`: a view process is forked from an interpreter that
# `init` has already initialised (§4, §9.3), and library code must never
# start or stop one.
pyo3 = { version = "0.30.1", optional = true }
thiserror = "2.0.21"

[dev-dependencies]
# The tests own the interpreter: they attach to it themselves, and
# `auto-initialize` is what lets them (see `tests/gil.rs`).
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
