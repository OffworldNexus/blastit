[package]
name = "blastit-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blastit-frame = { version = "0.1.0", path = "../blastit-frame" }
# No `auto-initialize`: a view process is forked from an interpreter that
# `init` has already initialised (§4, §9.3), and library code must never
# start or stop one.
pyo3 = { version = "0.30.1" }
thiserror = "2.0.21"

[dev-dependencies]
# The tests own the interpreter: they attach to it themselves, and
# `auto-initialize` is what lets them (see `tests/gil.rs`).
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
