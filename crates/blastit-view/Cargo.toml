[package]
name = "blastit-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# No features at all (`MB.36.5`): the framing, the credit windows and the
# loaded-file codec are plain `std` and always compiled, and each view kind is a
# sibling crate — `blastit-view-python` (CPython), `blastit-view-php` (`libphp`)
# and `blastit-view-static` (the responder). A `--workspace` build or another
# crate's defaults therefore cannot drag `libpython` or `libphp` into an artifact
# that serves no view (`docs/knowledge/LESSONS.md` `MB.17`, `ADR-0016`).
default = []

[dependencies]
blastit-frame = { version = "0.2.1", path = "../blastit-frame" }
# The child's identity, filter and `RLIMIT_*` (`SpawnContext`), the `Fork` a
# forker answers with, and the one documented order of the child sequence
# (design §4.4 D1/D2). The view crates get the privileged primitives from the
# crate that owns them, never from a second spelling.
blastit-sys = { version = "0.2.1", path = "../blastit-sys" }
thiserror = "2.0.21"
