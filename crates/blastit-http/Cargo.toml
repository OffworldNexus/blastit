[package]
name = "blastit-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blastit-events = { version = "0.2.1", path = "../blastit-events" }
blastit-frame = { version = "0.2.1", path = "../blastit-frame" }
httparse = "1.10.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
# The accept-failure test shuts a live listening socket down; `std` has no
# `shutdown` for a listener, and rustix is the workspace's safe wrapper.
# `time` is not used here: rustix 1.1.5's linux_raw `net` backend references its
# `timespec` module, which only that module group (or `fs`/`process`) declares.
rustix = { version = "1.1.5", features = ["net", "time"] }
