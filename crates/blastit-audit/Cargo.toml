[package]
name = "blastit-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The observations `blastit check` diffs are dbproxy's own wire records
# (`WireSqlObs`) and the gate's body sample is `blastit-ingress`'s: both are the
# schema the run already produced, so the audit reads them instead of defining a
# second one.
blastit-dbproxy = { version = "0.2.0", path = "../blastit-dbproxy" }
blastit-ingress = { version = "0.2.0", path = "../blastit-ingress" }
# The manifest decides what a view may do, and sqlpolicy's normaliser decides
# how a statement is compared to a grant. Both are already in this workspace, so
# the one grant diff gains no new dependency.
blastit-manifest = { version = "0.2.0", path = "../blastit-manifest" }
blastit-sqlpolicy = { version = "0.2.0", path = "../blastit-sqlpolicy" }
serde = { version = "1.0.229", features = ["derive"] }
# The observations come in as JSON and the report goes out as JSON: a hand-rolled
# encoder is one escaping bug away from writing a broken report.
serde_json = "1.0.154"
thiserror = "2.0.21"
