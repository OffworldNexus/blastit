[lints]
workspace = true

# The frozen ABI description (`abi`), stage-0 discovery (`discovery`) and the
# one `dlopen` module (`loader`). It depends on `blastit-sys` alone: the shared
# `(path, st_dev, st_ino)` open and the bounds-checked ELF reader both live
# there, and neither `serde` nor `pyo3` belongs on stage 0's path. The JSON
# request/response codec is `blastit-py-shim`'s (design
# `universal-distribution.md` §1.1), and the `dlopen`/`dlsym` declarations are
# hand-written over `libdl` the way `blastit-php-sapi` does it.
[dependencies]
blastit-sys = { version = "0.2.0", path = "../blastit-sys" }
