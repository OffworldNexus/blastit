# Every `console` fence of the public documentation, and how the harness runs it.
#
# The page list is every page the site publishes: `README.md` plus each
# `docs/**/*.md` that `zensical.toml`'s `exclude_docs` does not keep out of the
# build. It is the published tree, not the navigation, so a page the nav does
# not name still has to be accounted for here. `test_inventory` fails when a
# published page or a fence is missing, so adding a fence means adding one entry
# below. A fence entry names a handler (`mode`) and the project fixture it runs
# in; `reason` is required for the modes that do not execute the fence's own
# command, is shown in the report, and has to say what the gate checks instead
# (at least 15 characters: "deploy" or "TODO" is not an answer).
#
# One more key exists, checked by `run.py`:
#
# * `port_fallback = "<reason>"` lets a fence whose port is taken run the same
#   flag on the next free port; without it a busy port fails the fence instead.
#
# A product behaviour the page promises is asserted, never pinned: if it
# regresses, the fence goes red and says which documented promise broke.
#
# The fence bodies themselves are never copied: the harness reads them from the
# Markdown at run time. Editing a command or an expected output line therefore
# changes the run without editing this file.

