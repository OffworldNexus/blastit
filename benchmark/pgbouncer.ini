; PgBouncer in front of PostgreSQL for the benchmark.
;
; blastit's dbproxy keeps no connection pool — one inbound client connection is
; one upstream connection (§2.2 of ARCHITECTURE.md) — so the benchmark puts a
; pooler in front, the way the "no pooling" note says a real deployment should.
; It also normalises the backend connection count across servers whose models
; differ: granian and gunicorn open one pool *per process* (so a pool of ten
; under eight workers is eighty client connections), while blastit's is a single
; process. The pooler turns all of that into the same small set of server
; connections, so the database leg is measured on the query and the proxy, not
; on how many sockets each engine happened to open.

[databases]
bench = host=db port=5432 user=bench password=bench dbname=bench

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; Internal, trusted compose network: accept any client user and use the upstream
; credentials from [databases] above. `any` is `trust` without the requirement
; that the user also appear in an auth_file — which is what a throwaway
; benchmark network wants and a real one would not.
auth_type = any
; Transaction pooling, so many client connections share few server connections.
; The app runs autocommit with no named prepared statements (psycopg is built
; with prepare_threshold=None, see app.py), which is what transaction mode needs.
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
unix_socket_dir = /var/run/pgbouncer
ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
