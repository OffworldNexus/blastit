name = "Blastfile"
grammar = "blastfile"
path_suffixes = ["Blastfile", "blastfile"]
line_comments = ["# "]
tab_size = 4
hard_tabs = false
autoclose_before = ",;]}"
brackets = [
  { start = "{", end = "}", close = true, surround = true, newline = true },
  { start = "(", end = ")", close = true, surround = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
