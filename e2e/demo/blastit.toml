# The blastit manifest of the demo app. Generated by e2e/grants.py from a
# harvest of the e2e scenario, then committed (ARCHITECTURE.md §6).
version = 1
groups = ["connection"]

[proxy.db]
protocol = "postgresql"
input = { url = "DATABASE_URL" }

# Django's own connection housekeeping: the time zone on a new connection when
# the server's isn't UTC, and the health check after a request had an error.
[group.connection.db]
queries = ["SELECT set_config('TimeZone', $1, false)", "SELECT 1"]

# Statements several routes share: session and user lookups.
[group.session.db]
queries = [
  'SELECT "django_session"."session_key", "django_session"."session_data", "django_session"."expire_date" FROM "django_session" WHERE ("django_session"."expire_date" > $1 AND "django_session"."session_key" = $2) LIMIT 21',
  'SELECT "auth_user"."id", "auth_user"."password", "auth_user"."last_login", "auth_user"."is_superuser", "auth_user"."username", "auth_user"."first_name", "auth_user"."last_name", "auth_user"."email", "auth_user"."is_staff", "auth_user"."is_active", "auth_user"."date_joined" FROM "auth_user" WHERE "auth_user"."id" = $1 LIMIT 21',
]

[[route]]
name = "login"
path = ['/login/']
methods = ["GET", "POST"]
[route.db]
transaction_control = true
queries = [
  'SELECT "auth_user"."id", "auth_user"."password", "auth_user"."last_login", "auth_user"."is_superuser", "auth_user"."username", "auth_user"."first_name", "auth_user"."last_name", "auth_user"."email", "auth_user"."is_staff", "auth_user"."is_active", "auth_user"."date_joined" FROM "auth_user" WHERE "auth_user"."username" = $1 LIMIT 21',
  'SELECT $1 AS "a" FROM "django_session" WHERE "django_session"."session_key" = $2 LIMIT 1',
  'INSERT INTO "django_session" ("session_key", "session_data", "expire_date") VALUES ($1, $2, $3)',
  'UPDATE "auth_user" SET "last_login" = $1 WHERE "auth_user"."id" = $2',
  'UPDATE "django_session" SET "session_data" = $1, "expire_date" = $2 WHERE "django_session"."session_key" = $3',
]

[[route]]
name = "logout"
path = ['/logout/']
methods = ["POST"]
groups = ["session"]
[route.db]
transaction_control = true
queries = [
  'SELECT "django_session"."session_key", "django_session"."session_data", "django_session"."expire_date" FROM "django_session" WHERE "django_session"."session_key" = $1 LIMIT 21',
  'DELETE FROM "django_session" WHERE "django_session"."session_key" IN ($1)',
]

[[route]]
name = "notes"
path = ['/notes/', '/notes/[0-9]+/delete/', '/notes/peek/', '/notes/sql/']
groups = ["session"]
[route.db]
transaction_control = true
queries = [
  'INSERT INTO "notes_note" ("owner_id", "text") VALUES ($1, $2) RETURNING "notes_note"."id"',
  'SELECT "notes_note"."id", "notes_note"."owner_id", "notes_note"."text" FROM "notes_note" WHERE "notes_note"."owner_id" = $1 ORDER BY "notes_note"."id" ASC',
  'SELECT "notes_note"."id", "notes_note"."owner_id", "notes_note"."text" FROM "notes_note" WHERE ("notes_note"."id" = $1 AND "notes_note"."owner_id" = $2) LIMIT 21',
  'DELETE FROM "notes_note" WHERE "notes_note"."id" IN ($1)',
]

[[route]]
name = "debug"
path = ['/debug/env/', '/debug/request/', '/debug/caps/', '/debug/egress/']
methods = ["GET"]

[[route]]
name = "sql"
path = ['/debug/sql/']
methods = ["GET"]
[route.db]
queries = [
  'SELECT count(*) FROM notes_note',
]

[[route]]
name = "egress"
path = ['/egress/probe/']
methods = ["GET"]
egress = true

[[route]]
name = "fallback"
path = ['.*']
