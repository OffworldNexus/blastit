# The PHP page's manifest (`docs/frameworks/php.md` §1), with a second route so
# the e2e can prove each `[route.php]` gets its own entry and worker set.
version = 1

# The API route is above the catch-all (`docs/frameworks/php.md` §4); it has no
# `[route.static]` block, so `..` in a path is data for its front controller.
[[route]]
name = "api"
path = ['/api/.*']

[route.php]
entry = "api/index.php"
workers = 1

[route.ingress]
body = "form"

[[route]]
name = "app"
path = ['.*']

[route.php]
entry = "public/index.php"

[route.static]
root = "public"

[route.ingress]
body = "form"
