# End-to-end test: the demo app under blastit, against a real PostgreSQL.
# Driven by e2e/run.py; see e2e/README.md.
#
# The project and image names are overridable so that two checkouts can run the
# test at the same time: `E2E_PROJECT=d2-e2e E2E_IMAGE=blastit-e2e-d2
# E2E_PORT=18181 uv run python e2e/run.py`. CI uses the defaults.
name: ${E2E_PROJECT:-blastit-e2e}

x-app-env: &app-env
  DATABASE_URL: postgresql://demo:${E2E_DB_PASSWORD:?}@db:5432/demo?sslmode=disable
  DJANGO_SECRET_KEY: e2e-not-secret
  BLASTIT_LOG_FORMAT: json

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?}
      POSTGRES_DB: demo
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "demo"]
      interval: 1s
      retries: 60

  # Schema and users, with the real credentials, outside blastit.
  migrate:
    build:
      context: ..
      dockerfile: "e2e/${E2E_DOCKERFILE:-Dockerfile}"
      # `Dockerfile.prebuilt` installs a wheel built on this host, and that
      # wheel's tag is the interpreter it needs (`e2e/prebuilt_wheel.py` reads
      # it; the driver passes it). The in-image build pins its own base image
      # and ignores this.
      args: { PYTHON_VERSION: "${E2E_PYTHON_VERSION:-3.13}" }
    image: ${E2E_IMAGE:-blastit-e2e}
    environment: *app-env
    command:
      - sh
      - -c
      - >-
        python manage.py migrate -v0 && python manage.py seed &&
        python /sqlalchemy/setup.py
    depends_on: { db: { condition: service_healthy } }

  app:
    image: ${E2E_IMAGE:-blastit-e2e}
    environment: *app-env
    ports: ["127.0.0.1:${E2E_PORT:-18080}:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  # The second app of the end-to-end test (E2b): Flask + SQLAlchemy, on the same
  # image and the same database, with a manifest of its own. It runs *in*
  # `/sqlalchemy`, so the working directory blastit was started in is what puts
  # `app` on `sys.path` (§5.3) — the app is not installed, and `PYTHONPATH` is
  # emptied here so that nothing else can put anything there: the interesting
  # path is the working directory, and an inherited `PYTHONPATH` would hide a
  # regression in it.
  sqlalchemy:
    image: ${E2E_IMAGE:-blastit-e2e}
    environment:
      <<: *app-env
      BLASTIT_APP: app:application
      BLASTIT_MANIFEST: /sqlalchemy/blastit.toml
      BLASTIT_LOG_FORMAT: json
      PYTHONPATH: ""
      # The image preloads the Django demo's URLconf; this app has none.
      BLASTIT_PRELOAD: ""
    working_dir: /sqlalchemy
    ports: ["127.0.0.1:${E2E_SQLALCHEMY_PORT:-18081}:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  # The static-and-spa page's own manifest (MB.2.7), served by a real
  # `blastit dev` on the loopback default the page documents. The driver runs in
  # this container (`e2e/static_assets.py`) so `127.0.0.1:8080` is verbatim; the
  # fixture is copied to /site by run-dev.sh so the page's decoys (`public/.env`,
  # `public/.git/config`, a symlink to /etc/passwd) exist without being committed.
  static:
    image: ${E2E_IMAGE:-blastit-e2e}
    environment:
      BLASTIT_MANIFEST: /site/blastit.toml
      PORT: ${E2E_STATIC_PORT:-8080}
    working_dir: /site
    command: ["sh", "/opt/e2e/run-dev.sh", "/fixture", "/site", "decoys"]
    volumes:
      - ./static_site:/fixture:ro
      - ./static_site/run-dev.sh:/opt/e2e/run-dev.sh:ro
      - ./static_assets.py:/opt/e2e/static_assets.py:ro
      - ../docs/frameworks/static-and-spa.md:/opt/e2e/static-and-spa.md:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8080') + '/', timeout=2).read()"]
      interval: 1s
      timeout: 5s
      retries: 60

  # The same route without `spa`: a deep URL that is no file is a 404. The
  # driver reaches it by service name, so this one binds 0.0.0.0 and `blastit
  # dev` marks itself EXPOSED (the banner is not checked here).
  static_nospa:
    image: ${E2E_IMAGE:-blastit-e2e}
    environment:
      BLASTIT_MANIFEST: /site/blastit.toml
      BLASTIT_DEV_EXPOSE: "1"
    working_dir: /site
    command: ["sh", "/opt/e2e/run-dev.sh", "/fixture", "/site", "plain", "--host", "0.0.0.0"]
    volumes:
      - ./static_site/nospa:/fixture:ro
      - ./static_site/run-dev.sh:/opt/e2e/run-dev.sh:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).read()"]
      interval: 1s
      timeout: 5s
      retries: 60
