# End-to-end test: the demo app under blastit, against a real PostgreSQL.
# Driven by e2e/run.py; see e2e/README.md.
#
# The project and image names are overridable so that two checkouts can run the
# test at the same time: `E2E_PROJECT=d2-e2e E2E_IMAGE=blastit-e2e-d2
# E2E_PORT=18181 uv run python e2e/run.py`. CI uses the defaults.
name: ${E2E_PROJECT:-blastit-e2e}

x-app-env: &app-env
  DATABASE_URL: postgresql://demo:${E2E_DB_PASSWORD:?}@db:5432/demo?sslmode=disable
  DJANGO_SECRET_KEY: e2e-not-secret
  BLASTIT_LOG_FORMAT: json

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?}
      POSTGRES_DB: demo
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "demo"]
      interval: 1s
      retries: 60

  # Schema and users, with the real credentials, outside blastit.
  migrate:
    build: { context: .., dockerfile: "e2e/${E2E_DOCKERFILE:-Dockerfile}" }
    image: ${E2E_IMAGE:-blastit-e2e}
    environment: *app-env
    command:
      - sh
      - -c
      - >-
        python manage.py migrate -v0 && python manage.py seed &&
        python /sqlalchemy/setup.py
    depends_on: { db: { condition: service_healthy } }

  app:
    image: ${E2E_IMAGE:-blastit-e2e}
    environment: *app-env
    ports: ["127.0.0.1:${E2E_PORT:-18080}:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  # The second app of the end-to-end test (E2b): Flask + SQLAlchemy, on the same
  # image and the same database, with a manifest of its own. It runs *in*
  # `/sqlalchemy`, so the working directory blastit was started in is what puts
  # `app` on `sys.path` (§5.3) — the app is not installed, and `PYTHONPATH` is
  # emptied here so that nothing else can put anything there: the interesting
  # path is the working directory, and an inherited `PYTHONPATH` would hide a
  # regression in it.
  sqlalchemy:
    image: ${E2E_IMAGE:-blastit-e2e}
    environment:
      <<: *app-env
      BLASTIT_APP: app:application
      BLASTIT_MANIFEST: /sqlalchemy/blastit.toml
      BLASTIT_LOG_FORMAT: json
      PYTHONPATH: ""
      # The image preloads the Django demo's URLconf; this app has none.
      BLASTIT_PRELOAD: ""
    working_dir: /sqlalchemy
    ports: ["127.0.0.1:${E2E_SQLALCHEMY_PORT:-18081}:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
