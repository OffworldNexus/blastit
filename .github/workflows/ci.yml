name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # blastit-view embeds CPython (pyo3); every job builds it.
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      # A real PostgreSQL for dbproxy's tests (blastit-dbproxy reads BLASTIT_TEST_PG_URL).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blastit
          POSTGRES_PASSWORD: ci-not-secret
          POSTGRES_DB: blastit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blastit" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      BLASTIT_TEST_PG_URL: postgresql://blastit:ci-not-secret@127.0.0.1:5432/blastit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  smoke:
    name: smoke (root)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blastit
          POSTGRES_PASSWORD: ci-not-secret
          POSTGRES_DB: blastit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blastit" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      BLASTIT_TEST_PG_URL: postgresql://blastit:ci-not-secret@127.0.0.1:5432/blastit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      # The runner image ships /opt and its tool cache world-writable; blastit refuses an
      # interpreter a view uid could plant a module in, as it should.
      - run: sudo chmod go-w /opt && sudo chmod -R go-w /opt/hostedtoolcache
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # init must be root (PID 1 in the container); the smoke tests start the real binary.
      - run: cargo build -p blastit --tests --locked
      - run: sudo -E env "PATH=$PATH" cargo test -p blastit --locked -- --test-threads=1

  e2e:
    name: e2e (Django under blastit, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        run: pipx install maturin && scripts/build-wheel.sh
        env:
          MATURIN: maturin
      - name: Run the scenario under blastit
        run: python e2e/run.py
        env:
          E2E_DOCKERFILE: Dockerfile.prebuilt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-app-log
          path: e2e/app.log
          if-no-files-found: ignore

  rootless:
    name: e2e rootless (capabilities, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        run: pipx install maturin && scripts/build-wheel.sh
        env:
          MATURIN: maturin
      - name: Run the scenario with capabilities instead of root
        run: python e2e/rootless/run.py --local --dockerfile Dockerfile.prebuilt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootless-app-log
          path: e2e/rootless/out/
          if-no-files-found: ignore

  wheel-smoke:
    name: wheel in a uv virtualenv (modelw/base, CPython 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.14"
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        run: pipx install maturin && scripts/build-wheel.sh
        env:
          MATURIN: maturin
      - run: e2e/venv-smoke.sh

  pytest-plugin:
    name: pytest plugin (CPython 3.14, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blastit
          POSTGRES_PASSWORD: ci-not-secret
          POSTGRES_DB: blastit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blastit" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://blastit:ci-not-secret@127.0.0.1:5432/blastit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.14"
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      # The runner image ships /opt and its tool cache world-writable; blastit refuses an
      # interpreter a view uid could plant a module in, as it should.
      - run: sudo chmod go-w /opt && sudo chmod -R go-w /opt/hostedtoolcache
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        run: pipx install maturin && scripts/build-wheel.sh
        env:
          MATURIN: maturin
      - name: Install the wheel and the test tools
        run: |
          python -m venv /tmp/blastit-tests
          /tmp/blastit-tests/bin/pip install dist/blastit-*.whl pytest pytest-django pytest-xdist django 'psycopg[binary]'
      - name: Run the plugin's tests
        run: /tmp/blastit-tests/bin/pytest python/tests -q
