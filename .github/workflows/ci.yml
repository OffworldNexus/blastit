name: CI

# The pull-request gate: what a change must prove before it can land on
# `develop`. Every job names the `TESTING_PLAN.md` story it proves, and the
# Docker-backed story suites run where Docker exists — the application/runtime
# suite (§2) here, the installation stories (§3) in `packages.yml`/`wheels.yml`,
# and the production presets (§6) in `nightly.yml`.
#
# The privileged host-tree suites this file once ran as root (`smoke (root)`) are
# gone: the containerized `e2e/run_prod.py` (`nightly.yml`) is the witness for
# what root does in production, and it proves it in real containers instead of on
# a runner that shares its kernel with the harness. `docs.yml` owns the page and
# package-suite checks, so this file no longer duplicates them.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # blastit-view embeds CPython (pyo3); every job builds it.
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: 'lint: fmt, clippy -D warnings, rustdoc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --features python -- -D warnings
      - run: cargo doc --workspace --no-deps --locked --features python
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: 'unit + integration: SQL grants against a real PostgreSQL'
    runs-on: ubuntu-latest
    services:
      # A real PostgreSQL for dbproxy's tests (blastit-dbproxy reads BLASTIT_TEST_PG_URL).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blastit
          POSTGRES_PASSWORD: ci-not-secret
          POSTGRES_DB: blastit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blastit" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      BLASTIT_TEST_PG_URL: postgresql://blastit:ci-not-secret@127.0.0.1:5432/blastit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The per-minor CPython shims are a **build artifact** (`target/py-sapi`),
      # so a `cargo test` that never built them passes only by accident.
      # `make python-runtime` builds both minors and fails closed
      # (`PY_SAPI_REQUIRE_ALL=1`) when an interpreter is missing, and
      # `uv python install` is what puts CPython 3.13 *and* 3.14 on the runner
      # (setup-python above pins 3.13 for PYO3 only).
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install the CPython minors the shims need
        run: |
          set -euo pipefail
          uv python install 3.13 3.14
          # `uv python install` puts CPython under `$UV_PYTHON_INSTALL_DIR`
          # (`~/.local/share/uv`), not on `PATH`, so every consumer that asks for
          # `/usr/local/bin/python3.13` finds nothing (`MB.49`). The link is the
          # interpreter `uv` just installed, never a second one.
          for minor in 3.13 3.14; do
            sudo --non-interactive ln -sfn "$(uv python find --no-project "$minor")" "/usr/local/bin/python$minor"
          done
      - name: Build the per-minor CPython shims (fails closed)
        run: make python-runtime
      # Ubuntu 24.04+ (today's `ubuntu-latest`) ships
      # `kernel.apparmor_restrict_unprivileged_userns=1`, so an unprivileged
      # child cannot create a user namespace and
      # `critical_fanotify::an_overlay_parent_handle_is_the_at_handle_fid_handle`
      # dies writing `/proc/self/setgroups` with `EACCES` (errno 13) — a red
      # `test` job that says nothing about the code under test. The sysctl only
      # exists on the kernels that restrict it, so the `-e` keeps older images
      # untouched, and `--non-interactive` turns a sudo that would prompt into an
      # immediate readable error.
      - name: Allow unprivileged user namespaces for the fanotify overlay test (Ubuntu 24.04+)
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo --non-interactive sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cargo test --workspace --all-targets --locked --features python
      - run: cargo test --workspace --doc --locked --features python

  msrv:
    name: MSRV 1.88 builds the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # R42: a protected critical test may never be skipped. The protection itself is
  # the file convention plus the per-node `paths` review, so the guard is one
  # grep (`make critical-skip-check`) with no cargo, no wheel and no network — it
  # has to run on a pull request, not only at the release gate.
  critical-guard:
    name: 'R42: no skip construct in a protected critical test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 'Test ripple: `make critical-skip-check`'
        run: make critical-skip-check

  # `MB.56.4.4` review: with `smoke (root)` retired, one assertion is still only
  # valid as uid 0 — `e2e_cli`'s `a_binary_owned_by_another_uid_is_refused` —
  # and under the unprivileged `test` job it prints `SKIP` and passes. This job
  # runs **one** test binary as root (not the old eight), and
  # `BLASTIT_REQUIRE_ROOT_TESTS=1` turns that skip into a failure.
  root-only:
    name: 'root-only: a binary owned by another uid is refused (uid 0)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build as the runner and hand root one absolute path: root never runs
      # `cargo`, so it cannot rebuild into the runner's `target/`, and this job
      # proves one bounded assertion instead of serialising a whole crate.
      - name: Build the e2e_cli test binary (runner user, no root)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cargo test -p blastit --locked --features python --test e2e_cli --no-run
          binary=$(find target/debug/deps -maxdepth 1 -type f -name 'e2e_cli-*' \
            -perm -u+x ! -name '*.d' | head -n 1)
          if [ -z "$binary" ]; then
            echo "::error::cargo built no e2e_cli test binary: the root-only assertion would silently disappear"
            exit 1
          fi
          echo "$binary" > "$RUNNER_TEMP/e2e_cli.bin"
          echo "root phase will run: $binary"
      # A sudo that wants a password can only block on /dev/tty with nothing in
      # the log; `--non-interactive` makes that an instant, readable red step.
      - name: Preflight (sudo is non-interactive)
        timeout-minutes: 1
        run: |
          set -euo pipefail
          sudo --non-interactive id -u >/dev/null
          echo "sudo: root reachable non-interactively"
      - name: Run the one binary as root (a root-only skip is fatal)
        timeout-minutes: 5
        run: |
          set -o pipefail
          binary=$(cat "$RUNNER_TEMP/e2e_cli.bin")
          sudo --non-interactive env \
            "HOME=$HOME" \
            "PATH=$HOME/.cargo/bin:$PATH" \
            "PYO3_PYTHON=$PYO3_PYTHON" \
            "BLASTIT_REQUIRE_ROOT_TESTS=1" \
            stdbuf -oL -eL "$binary" --test-threads=1 --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/root-only.log"
      - name: Upload the root-only log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: root-only-logs
          path: ${{ runner.temp }}/root-only.log
          if-no-files-found: ignore

  e2e:
    name: '§2 apps: PHP 8.4, Django & Flask on 3.13/3.14, static (Docker)'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The two WSGI legs run on the host's CPython 3.13/3.14 and load the
      # per-minor shims, and `run_apps.py` mounts the release binary into every
      # container: build both before the suite starts.
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install the CPython minors the shims need
        run: uv python install 3.13 3.14
      - name: Build the per-minor CPython shims (fails closed)
        run: make python-runtime
      - name: Build the binary under test
        run: cargo build -p blastit --release --locked
      - name: Run the application suite (e2e/run_apps.py)
        run: |
          set -o pipefail
          uv run --no-project e2e/run_apps.py 2>&1 | tee "$RUNNER_TEMP/apps.log"
      # A leg whose host fact is missing (Docker, a CPython minor, the shims)
      # prints `SKIP` and exits 0, so a green job would prove nothing. The
      # printout is the verdict: every framework/static leg PASSed and nothing
      # skipped.
      - name: 'guard: every §2 app leg served, none skipped'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/apps.log"
          status=0
          if skipped=$(grep -nE '^SKIP ' "$log"); then
            echo "::error::an application leg skipped instead of serving: this runner is missing a host fact the suite needs"
            echo "$skipped"
            status=1
          fi
          for evidence in \
              'PASS  django 3\.13 ' 'PASS  flask 3\.13 ' \
              'PASS  django 3\.14 ' 'PASS  flask 3\.14 ' \
              'PASS  php 8\.4 ' 'PASS  static '; do
            if ! grep -qE "$evidence" "$log"; then
              echo "::error::the proof line is missing from the run: $evidence"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "--- $log (tail) ---"
            tail -n 80 "$log"
            exit 1
          fi
          echo "the application legs served: $(grep -cE '^PASS  (django|flask|php|static)' "$log") leg(s)"

  # `MB.17`: a plain `cargo build -p blastit` must be the artifact you can copy
  # onto a server that never had Python. Two proofs, because they fail
  # differently: `readelf` shows the binary links no `libpython` and carries no
  # `RUNPATH` into the build host's uv cache, and execution inside an image with
  # no CPython at all shows the boot path never reaches an interpreter. The
  # second is the one that would have caught 0.2.0's shipped binary: it linked
  # `libpython3.14.so.1.0` *and* a `RUNPATH` pointing at one developer's
  # `~/.local/share/uv/python/...`.
  #
  # This binary is built **on the runner** and executed in `debian:trixie-slim`,
  # which is allowed by the only arm of `MB.3.58`'s rule that permits it: the
  # image's glibc (2.41) is at least the runner's (2.39). Being newer is a
  # property of today's runner, not a promise, so the step below reads both
  # numbers and fails with them named.
  standalone:
    name: '§3 standalone binary: no libpython, serves with no CPython in the image'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the default (standalone) binary
        run: cargo build -p blastit --locked
      - name: It links no interpreter and no build-host RUNPATH
        run: scripts/check-portable-elf.sh target/debug/blastit
      # The execution proof is only an execution proof while the image has no
      # Python: if a future debian:trixie-slim ships one, this fails and the
      # image (or the assertion) has to be reconsidered rather than the check
      # quietly becoming an inspection.
      - name: The image really has no Python
        run: |
          set -euo pipefail
          docker run --rm debian:trixie-slim sh -eu -c '
            for candidate in python python3 python3.13 python3.14; do
              if command -v "$candidate" >/dev/null 2>&1; then
                echo "error: debian:trixie-slim now ships $candidate at $(command -v "$candidate")" >&2
                exit 1
              fi
            done
            echo "debian:trixie-slim: no CPython on PATH"'
      # `MB.3.58`: this binary was built on the runner (glibc 2.39 today), and a
      # container only runs what it built itself or what needs no more than it
      # has. The check reads the floor out of the ELF and the version out of the
      # image, so the day `ubuntu-latest` outgrows `debian:trixie-slim` this job
      # says which two numbers disagree instead of failing at `execve` with
      # `weak version 'GLIBC_…' not found`.
      - name: The runtime image is not older than the builder
        run: >-
          scripts/check-exec-env.sh --image debian:trixie-slim
          --binary target/debug/blastit
      - name: Serve a static fixture where no Python exists
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/target/debug/blastit:/usr/local/bin/blastit:ro" \
            -v "$PWD/scripts/standalone-runtime-check.sh:/usr/local/bin/standalone-runtime-check.sh:ro" \
            -e BLASTIT_BIN=/usr/local/bin/blastit \
            debian:trixie-slim bash /usr/local/bin/standalone-runtime-check.sh --require-no-python

  # The editor binaries (`MB.35`): five targets, declared once in
  # `scripts/platform_matrix.py --matrix lsp` and built on each **native** runner.
  # A leg is a proof only after `scripts/lsp_smoke.py` drove a real session
  # against the archive it publishes — macOS and Windows included, because those
  # are exactly the files the Zed extension downloads (§8.3a).
  matrix:
    name: the leg list (scripts/platform_matrix.py)
    runs-on: ubuntu-24.04
    outputs:
      lsp: ${{ steps.legs.outputs.lsp }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      - id: legs
        run: echo "lsp=$(uv run --no-project scripts/platform_matrix.py --matrix lsp)" >> "$GITHUB_OUTPUT"

  lsp:
    name: '§7.4 blastit-lsp (${{ matrix.target }}) drives a real session'
    needs: matrix
    # The native runner per leg comes from the matrix: an artifact nothing
    # executed is a claim, not a proof (`MB.35.1`).
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.lsp) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Per target: a warm `target/<triple>` from another OS must never be
          # linked into this archive.
          key: lsp-${{ matrix.target }}
      # `pg_query`'s build runs bindgen, which needs the clang C API by name, and
      # `clang-sys` 1.9.1 has no registry fallback: `windows-latest` leaves
      # `LIBCLANG_PATH` unset and the search stops at clang-sys's own list, so the
      # `bin` directory that holds `libclang.dll` is pinned here
      # (`docs/research/2026-11-17-cross-platform-blastit-lsp.md` §Q1).
      - name: Pin LIBCLANG_PATH (research §Q1)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      # A Linux leg is built inside the image whose glibc *is* its floor and the
      # floor is asserted by the build (`MB.3.60`'s class, an editor binary this
      # time); the Apple and Windows legs build on the runner's own toolchain,
      # because no container has their C library.
      - name: Build the archive (native, or inside the matrix builder image)
        shell: bash
        run: |
          set -euo pipefail
          args=(--target "${{ matrix.target }}" --out dist
                --archive "${{ matrix.archive }}"
                --executable "${{ matrix.executable }}"
                --dir "${{ matrix.dir }}")
          if [ -n "${{ matrix.builder_image }}" ]; then
              args+=(--image "${{ matrix.builder_image }}" --max-glibc "${{ matrix.glibc_floor }}")
          fi
          bash scripts/build-lsp.sh "${args[@]}"
      # §14.4.1: unpack the archive the release will publish, assert its three
      # entries, and smoke **the extracted file** — never the build tree's copy.
      # The directory and the executable are the matrix's, so the unpack cannot
      # disagree with what the build staged.
      - name: Unpack the archive and smoke the extracted file
        shell: bash
        run: |
          set -euo pipefail
          tmp="dist/smoke-${{ matrix.target }}"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          case "${{ matrix.archive }}" in
              *.zip) "${{ matrix.python }}" -m zipfile -e "dist/${{ matrix.archive }}" "$tmp" ;;
              *) tar -xzf "dist/${{ matrix.archive }}" -C "$tmp" ;;
          esac
          ( cd "$tmp/${{ matrix.dir }}" && ls | sort | tr '\n' ',' && echo )
          # The archive's own list, verified with the tool this OS has:
          # `sha256sum -c` on Linux/Windows, `shasum -a 256 -c` on macOS (which
          # ships no coreutils; `-a 256` matters because `shasum -c` means SHA-1).
          ( cd "$tmp/${{ matrix.dir }}" && ${{ matrix.sha_verify }} )
          "${{ matrix.python }}" scripts/lsp_smoke.py \
              --binary "$tmp/${{ matrix.dir }}/${{ matrix.executable }}"

  wheel-smoke:
    name: '§3 py3-none wheel: installed and served in bare CPython images'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.14"
      - run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `e2e/run_packaging.py --leg wheel` installs the wheel into the images
      # `scripts/platform_matrix.py --matrix wheels` names and serves a WSGI view
      # through the shipped shim, so the wheel must carry both CPython shims
      # (`MB.47.2`).
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install the CPython minors the shims need
        run: uv python install 3.13 3.14
      - name: Build the per-minor CPython shims (fails closed)
        run: make python-runtime
      - name: Build the wheel
        run: pipx install maturin && scripts/build-wheel.sh --require-shims py --out dist
        env:
          MATURIN: maturin
      - name: Install it in every image its leg names and drive it (e2e/run_packaging.py)
        run: uv run --no-project e2e/run_packaging.py --require-legs --leg wheel --wheel "$(ls dist/blastit-*-py3-none-*.whl | head -n 1)"
