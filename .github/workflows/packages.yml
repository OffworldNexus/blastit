name: Packages

# The signed APT/RPM repositories (`apt.offworld-nexus.app`, `rpm.offworld-nexus.app`).
#
# A `v*` tag builds the language package set per architecture from the §6.1 bundle,
# installs each set in **every** distribution the repositories advertise, and
# then stages exactly one `offworld-dist` artifact with
# `packaging/stage-dist.py`. That artifact is the whole hand-off: the
# organization's `offworld-nexus-packages` GitHub App signs it, publishes it, and
# posts an `offworld-pkg / publish (stable)` check run. **No token, key or secret
# lives in this workflow** — there is nothing here to leak and nothing to rotate.
#
# A `workflow_dispatch` must run **on the tag ref** (`gh workflow run
# packages.yml --ref v0.2.1`): `stage-dist.py` refuses `stable` off a non-
# `refs/tags/v*` ref, and a branch rehearsal belongs to `nightly.yml`. A
# dispatch with `rehearsal: true` builds and install-verifies the same matrix,
# runs `stage-dist.py --dry-run`, and uploads nothing.
#
# Everything that names a leg comes from `scripts/platform_matrix.py`:
# `--matrix install` (the six distributions × two architectures) and
# `--matrix packages` (the four `.deb`/`.rpm` legs). A literal `debian:...` or a
# hand-written leg list is the copy that goes stale; `nightly.yml` is this file's
# sibling — same graph, stamped versions and the `nightly` channel.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: >-
          Build and install-verify the whole matrix, then run
          `packaging/stage-dist.py --dry-run` and upload nothing.
        type: boolean
        default: false

concurrency:
  # One group with `publish-pypi.yml`: that workflow dispatches this one on the
  # same tag, and `cancel-in-progress: false` queues the dispatch behind the
  # release rather than building a bundle twice for one tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.13"

jobs:
  plan:
    name: tag, version and whether this run stages
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      should_stage: ${{ steps.plan.outputs.should_stage }}
      deb_version: ${{ steps.plan.outputs.deb_version }}
      deb_release: ${{ steps.plan.outputs.deb_release }}
      rpm_version: ${{ steps.plan.outputs.rpm_version }}
      rpm_release: ${{ steps.plan.outputs.rpm_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - name: The version, and whether this run may stage
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ]; then
              echo "::error::packages are staged from a tag ref, and this run is ${REF_TYPE:-unknown} ${REF_NAME:-<none>}: dispatch on the tag (gh workflow run packages.yml --ref v0.2.1), and use nightly.yml for branch rehearsals"
              exit 1
          fi
          # The tag and the manifest may not disagree: a `v0.2.0` tag on a
          # 0.2.1 tree is a release nobody can identify afterwards.
          scripts/check-release-tag.sh "$REF_NAME"
          version=${REF_NAME#v}
          stage=true
          if [ "$REHEARSAL" = true ]; then
              stage=false
              echo "::notice::rehearsal: the whole matrix builds and install-verifies, stage-dist.py runs with --dry-run, and nothing is uploaded"
          fi
          {
              echo "tag=$REF_NAME"
              echo "version=$version"
              echo "channel=stable"
              echo "should_stage=$stage"
          } >> "$GITHUB_OUTPUT"
          # All four version fields, from the one place that owns both formats.
          stamps=$(packaging/package-stamp.sh --format both --channel stable --base "$version")
          printf '%s\n' "$stamps" >> "$GITHUB_OUTPUT"
          for key in deb_version rpm_version rpm_release; do
              if ! printf '%s\n' "$stamps" | grep -q "^$key="; then
                  echo "::error::packaging/package-stamp.sh printed no $key for $version (stable)"
                  exit 1
              fi
          done
          echo "packages: tag $REF_NAME, channel stable, stages: $stage"

  matrix:
    name: the leg list (scripts/platform_matrix.py)
    runs-on: ubuntu-24.04
    outputs:
      install: ${{ steps.legs.outputs.install }}
      packages: ${{ steps.legs.outputs.packages }}
      shims_gnu: ${{ steps.legs.outputs.shims_gnu }}
      py_shims_gnu: ${{ steps.legs.outputs.py_shims_gnu }}
      hosts: ${{ steps.legs.outputs.hosts }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
      - name: The matrix and the published counts agree
        run: uv run --no-project scripts/platform_matrix.py --check --channel stable
      - id: legs
        run: |
          set -euo pipefail
          # A package is built from a `gnu` bundle (§6.1), so the shim legs this
          # workflow needs are that libc's — and they are still the matrix's list.
          echo "install=$(uv run --no-project scripts/platform_matrix.py --matrix install --channel stable)" >> "$GITHUB_OUTPUT"
          echo "packages=$(uv run --no-project scripts/platform_matrix.py --matrix packages --channel stable)" >> "$GITHUB_OUTPUT"
          echo "shims_gnu=$(uv run --no-project scripts/platform_matrix.py --matrix shims --libc gnu --channel stable)" >> "$GITHUB_OUTPUT"
          echo "py_shims_gnu=$(uv run --no-project scripts/platform_matrix.py --matrix py-shims --libc gnu --channel stable)" >> "$GITHUB_OUTPUT"
          # The host stories (install.sh --user, the Composer wrapper) run on a
          # native runner per architecture, from the same matrix.
          echo "hosts=$(uv run --no-project scripts/platform_matrix.py --matrix hosts)" >> "$GITHUB_OUTPUT"

  shims:
    name: '§2 PHP ${{ matrix.minor }} shim, built and probed (${{ matrix.arch }}-${{ matrix.libc }})'
    needs: [matrix]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.shims_gnu) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
      # Built natively in the leg's own distro image and `dlopen`ed beside that
      # distro's signed NTS `libphp`, exactly as `php-sapi.yml` proves it: a shim
      # that compiled is not a shim that loaded, and only the probed one ships.
      - name: build the shim and run the real-load probe
        run: >-
          make php-sapi-e2e PHP_MINOR=${{ matrix.minor }} PHP_SAPI_LIBC=${{ matrix.libc }}
          PHP_SAPI_KEEP=1 PHP_SAPI_IMAGE=blastit-php-sapi-e2e:${{ matrix.name }}
      - name: take the probed shim out of its image
        run: >-
          scripts/collect-shim.sh blastit-php-sapi-e2e:${{ matrix.name }}
          target/proven-shims --minor ${{ matrix.minor }} --libc ${{ matrix.libc }}
          --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: shim-${{ matrix.name }}
          path: target/proven-shims/*.so
          if-no-files-found: error

  py_shims:
    name: '§2 CPython ${{ matrix.minor }} shim, ELF contract (${{ matrix.arch }}-${{ matrix.libc }})'
    needs: [matrix]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.py_shims_gnu) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
      # The shim is bound to one minor: `make py-sapi` resolves that interpreter,
      # builds with its headers and `dlopen`s the result against its libpython.
      - name: the interpreter this shim binds to
        run: uv python install ${{ matrix.interpreter }}
      - name: build the shim and assert its ELF contract
        run: make py-sapi PY_SAPI_REQUIRE_ALL=1 PY_MINORS="${{ matrix.minor }}"
      - uses: actions/upload-artifact@v6
        with:
          name: py-shim-${{ matrix.name }}
          path: target/py-sapi/${{ matrix.shim }}
          if-no-files-found: error

  packages:
    name: '§3 build the ${{ matrix.format }} packages for ${{ matrix.arch }}'
    needs: [plan, matrix, shims, py_shims]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/download-artifact@v7
        with:
          pattern: shim-${{ matrix.arch }}-gnu-*
          path: target/proven-shims
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: py-shim-${{ matrix.arch }}-gnu-*
          path: target/py-sapi
          merge-multiple: true
      # The bundle, not a host `make install`: `blastit`/`blastit-lsp` are
      # compiled inside `manylinux_2_28` and the whole tree is measured against
      # the matrix's shim floor, so the package's `Depends:`/`Requires:` is a
      # measured number and not the runner's glibc.
      - name: Assemble the §6.1 bundle from its floor images
        run: |
          set -euo pipefail
          uv run --no-project scripts/build-package-bundle.sh \
              --out "$RUNNER_TEMP/bundle" \
              --arch "${{ matrix.arch }}" \
              --shim-dir target/proven-shims \
              --py-shim-dir target/py-sapi \
              --bundle-floor "$(uv run --no-project scripts/platform_matrix.py --shim-floor)" \
              --channel stable
      # One package per interpreter the bundle carries (plus the core `blastit`),
      # so a host installs only the shim it can load; the list is the table's.
      - name: ${{ matrix.format }} from that bundle
        env:
          DEB_VERSION: ${{ needs.plan.outputs.deb_version }}
          DEB_RELEASE: ${{ needs.plan.outputs.deb_release }}
          RPM_VERSION: ${{ needs.plan.outputs.rpm_version }}
          RPM_RELEASE: ${{ needs.plan.outputs.rpm_release }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          floor=$(uv run --no-project scripts/platform_matrix.py --shim-floor)
          case "${{ matrix.format }}" in
              deb)
                  # A release `.deb` carries no Debian revision; a nightly's
                  # `~nightly…` stamp is part of the version, not of a revision.
                  args=(--version "$DEB_VERSION" --bundle "$bundle" --out dist --max-glibc "$floor")
                  [ -z "$DEB_RELEASE" ] || args+=(--release "$DEB_RELEASE")
                  scripts/build-deb.sh --channel stable "${args[@]}"
                  ;;
              rpm)
                  scripts/build-rpm.sh --version "$RPM_VERSION" --release "$RPM_RELEASE" \
                      --bundle "$bundle" --out dist --max-glibc "$floor" \
                      --channel stable
                  ;;
              *)
                  echo "::error::${{ matrix.format }} is not a package format this workflow builds"
                  exit 1
                  ;;
          esac
          shopt -s nullglob
          built=(dist/*.deb dist/*.rpm)
          # The declared set comes from packaging/languages.tsv (`MB.67`), so the
          # count is derived too: a literal here would be a second table.
          expected=$(packaging/package-set.sh --channel stable --names | grep -c '')
          echo "this leg built ${#built[@]} of ${expected} package(s): ${built[*]:-none}"
          if [ "${#built[@]}" -lt "$expected" ]; then
              echo "::error::expected $expected packages for ${{ matrix.arch }}, found ${#built[@]}"
              exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.name }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  install:
    name: '§3 ${{ matrix.image }} installs the ${{ matrix.format }} packages and runs them (${{ matrix.arch }})'
    needs: [matrix, packages]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.install) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
      # Only this leg's architecture: a `package-*` download hands an x86_64
      # container the aarch64 RPMs too, and `dnf` refuses those with
      # "does not have a compatible architecture".
      - uses: actions/download-artifact@v7
        with:
          pattern: package-${{ matrix.arch }}-*
          path: dist
          merge-multiple: true
      # One leg per (distribution, architecture): the image, the package format
      # and the phases are the matrix's, and `e2e/run_packaging.py --leg deb|rpm`
      # installs the set and drives `--version`, `fmt`, `check`,
      # `blastit-lsp --version` and a served page inside it.
      - name: install in ${{ matrix.image }} and drive it
        run: scripts/install_matrix.sh --leg "${{ matrix.name }}" --dir dist

  # `TESTING_PLAN.md` §3's user-space stories, on the host rather than in a
  # distribution image: `docs/install.sh --user` (zero `sudo`, from a release
  # archive served over `file://`, with a tampered archive refused) and the
  # Composer wrapper (`vendor/bin/blastit`, digests verified). Both legs are
  # `e2e/run_packaging.py`'s, so no step here repeats an install command, and both
  # architectures' native runners are the matrix's `hosts` list.
  user-space:
    name: '§3 install.sh --user + composer wrapper in user space (${{ matrix.arch }})'
    needs: [matrix]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release --locked -p blastit
      # A host release build, not the release archive: this workflow runs from a
      # tag and has no `standalone-*` artifact of its own. The archive-fed twin of
      # this story is `publish-pypi.yml`'s `§3 install.sh --user (gnu) + Alpine
      # musl install` job, which downloads the archives it just built.
      - name: install.sh --user on a host release build (e2e/run_packaging.py --leg install)
        run: >-
          uv run --no-project e2e/run_packaging.py --require-legs --leg install
          --binary target/release/blastit
      - name: Composer wrapper, vendor/bin/blastit (e2e/run_packaging.py --leg composer)
        run: uv run --no-project e2e/run_packaging.py --require-legs --leg composer

  # The one artifact the App signs. `packaging/stage-dist.py` is the only writer:
  # it validates every filename, architecture, nightly sort stamp and control
  # header, and emits the `manifest.json` the publisher reads. Hand-rolling that
  # file is how a bundle ends up describing packages it does not contain.
  stage:
    name: one offworld-dist bundle
    needs: [plan, packages, install, user-space]
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.packages.result == 'success' &&
      needs.install.result == 'success' &&
      needs.user-space.result == 'success'
    runs-on: ubuntu-24.04
    # The RPM sets are unpacked by a containerised `rpm2cpio`/`cpio`
    # (`rockylinux:9`), so this job is not the seconds-long step its size suggests.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      # The acceptance criterion "a set missing one shim fails by name": each set
      # is unpacked into one merged `/usr` and asserted as the release set
      # `packaging/languages.tsv` declares, naming the package that is missing. One directory per (format,
      # arch), because the RPM set is unpacked into a single root by a container —
      # two arches in one directory would overwrite each other's `lib/blastit`.
      # This step makes no execution claim: `install` already runs each set in its
      # own distribution container, and the script itself skips `--version` for a
      # set unpacked on another architecture.
      - name: The package sets are the declared release
        run: |
          set -euo pipefail
          mkdir -p sets/deb-amd64 sets/deb-arm64 sets/rpm-x86_64 sets/rpm-aarch64
          cp dist/*_amd64.deb sets/deb-amd64/
          cp dist/*_arm64.deb sets/deb-arm64/
          cp dist/*.x86_64.rpm sets/rpm-x86_64/
          cp dist/*.aarch64.rpm sets/rpm-aarch64/
          scripts/check-bundle-layout.sh --deb-set sets/deb-amd64 --arch amd64 --channel stable
          scripts/check-bundle-layout.sh --deb-set sets/deb-arm64 --arch arm64 --channel stable
          scripts/check-bundle-layout.sh --rpm-set sets/rpm-x86_64 --arch x86_64 --channel stable
          scripts/check-bundle-layout.sh --rpm-set sets/rpm-aarch64 --arch aarch64 --channel stable
      - name: Validate the package set and stage it (or rehearse it)
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHOULD_STAGE: ${{ needs.plan.outputs.should_stage }}
        run: |
          set -euo pipefail
          echo "staging $(ls dist | wc -l) file(s) from dist/"
          args=(
              --source blastit
              --channel "$CHANNEL"
              --version "$VERSION"
              --ref "$GITHUB_REF"
              --keep-nightlies 7
              --file 'deb:amd64:dist/*_amd64.deb'
              --file 'deb:arm64:dist/*_arm64.deb'
              --file 'rpm:x86_64:dist/*.x86_64.rpm'
              --file 'rpm:aarch64:dist/*.aarch64.rpm'
              --out "$RUNNER_TEMP/offworld-dist"
          )
          if [ "$SHOULD_STAGE" != true ]; then
              args+=(--dry-run)
              echo "::notice::rehearsal: stage-dist.py validates the set and prints the manifest"
          fi
          python3 packaging/stage-dist.py "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: needs.plan.outputs.should_stage == 'true'
        with:
          name: offworld-dist
          path: ${{ runner.temp }}/offworld-dist
          if-no-files-found: error
          retention-days: 7
