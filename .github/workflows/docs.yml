name: Docs

# Builds the documentation site on every pull request and every push to
# `develop`, so a broken link is a red check rather than a broken page.
#
# Deployment is deliberately *not* on every push. A Pages deployment replaces
# the whole site, and the site currently deployed there is not (yet) these
# docs: it is the PEP 503 wheel index that `release.yml` used to publish, and
# that lock files written before E4 still point at
# (https://offworldnexus.github.io/blastit/simple/). E4 retired the index in
# favour of PyPI and added `publish-pypi.yml`, but the last index is still being
# served until something deploys. So the site goes up on an explicit
# `workflow_dispatch`, and on a `v*` tag, which is the release: by then the
# wheels are on PyPI and the Pages site is free to be just the documentation.
#
# The `github-pages` environment restricts deployments to a branch policy that
# currently lists `develop` alone, so a tag needs a deployment branch policy of
# its own:
#
#   gh api --method POST \
#     repos/OffworldNexus/blastit/environments/github-pages/deployment-branch-policies \
#     -f name='v*' -f type=tag
#
# Until that is done, a tag deploy is refused by the environment, not by this
# file.

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  # Pinned: a Zensical release can change what counts as a warning, and a docs
  # build that suddenly fails on an unrelated PR is worse than a deliberate
  # bump. `uvx` is not used here because the runner has pipx and the repository
  # already installs build tools that way.
  ZENSICAL_VERSION: "0.0.73"

jobs:
  build:
    name: build (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Zensical
        run: pipx install "zensical==$ZENSICAL_VERSION"
      # `--strict` aborts on a warning, and link validation is on by default:
      # every internal link and every link anchor is resolved, so a renamed
      # heading or a moved page fails this job.
      - name: Build
        run: zensical build --strict
      # Only the deploy job consumes this, and `upload-pages-artifact` only
      # exists for a run that may deploy.
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
      - name: Upload the site
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy (GitHub Pages)
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
