name: Docs

# Builds the documentation site on every pull request and every push to
# `develop`, so a broken link is a red check rather than a broken page, and
# deploys it on every push to `develop`, on `workflow_dispatch`, and on a pushed
# `v*` tag.
#
# This workflow owns the pages: the nav/orphan check, the `--strict` build, the
# package's offline suites, and the installer the README's hero advertises as a
# served asset. `ci.yml` runs no docs job — one workflow, one owner (`MB.56.4.4`
# removed the duplicate `docs-gate`).
#
# The site is the only thing GitHub Pages serves here now: the PEP 503 wheel
# index that `release.yml` used to publish was retired in E4, and releases go to
# PyPI instead. Deploying from `develop` is also what makes the README's links
# into the documentation live.
#
# `--strict` cannot see a page that `docs/` holds but the nav does not name, and
# it publishes those pages all the same (`site/orphan/index.html`,
# `docs/testing/AUDIT-MA.3.md` F3). The step below closes that class itself:
# every Markdown page under `docs/` that `exclude_docs` does not keep out of the
# build must be named by the nav, so a page/nav drift is a red Docs check instead
# of an orphan page on the site. It needs no wheel and no cargo, only the
# repository.
#
# The installer the README's hero advertises is a *served asset*, not a page:
# https://offworldnexus.github.io/blastit/install.sh must be the exact bytes this
# repository reviewed. The "Publish and prove install.sh" step makes that a fact
# instead of a property of the site builder: it copies `docs/install.sh` into the
# built `site/`, compares the two with `cmp`, fetches the file back over HTTP and
# compares that too, then pipes the served URL into `sh -s -- --help`. The pipe
# is how a new user runs it, and it is a help-only smoke: no repository is
# touched, nothing is installed. (The installer's own install stories are
# `e2e/run_packaging.py --leg install|alpine`, run by `packages.yml` and
# `publish-pypi.yml`.)

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  # Pinned: a Zensical release can change what counts as a warning, and a docs
  # build that suddenly fails on an unrelated PR is worse than a deliberate
  # bump. `uvx` is not used here because the runner has pipx and the repository
  # already installs build tools that way.
  ZENSICAL_VERSION: "0.0.73"

jobs:
  build:
    name: 'pages: nav/orphan check, strict build, served install.sh + offline suites'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.2
      # The page list `zensical.toml` publishes must be the one its nav names:
      # every Markdown page under `docs_dir` that `exclude_docs` does not keep
      # out has to appear in the nav, exactly as `--strict` would publish it. An
      # orphan page ships a URL nothing links to, which is a page the review
      # never read.
      - name: Check the page list (no orphan page reaches the site)
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv run --no-project python - <<'PY'
          import fnmatch
          import sys
          import tomllib
          from pathlib import Path

          problems: list[str] = []

          # `zensical.toml` is where the site and the gate both get their page
          # list from, so the orphan check reads what the build reads:
          # `docs_dir/**/*.md` minus `exclude_docs` (mkdocs syntax: a trailing
          # `/` excludes a directory, anything else is a glob) against the nav.
          config = tomllib.loads(Path("zensical.toml").read_text(encoding="utf-8"))
          project = config["project"]
          docs_dir = Path(project.get("docs_dir", "docs"))
          excluded = [
              rule.strip()
              for rule in project.get("exclude_docs", "").splitlines()
              if rule.strip()
          ]

          def excludes(page: str) -> bool:
              for rule in excluded:
                  rule = rule.lstrip("/")
                  if rule.endswith("/"):
                      if page.startswith(rule):
                          return True
                  elif fnmatch.fnmatchcase(page, rule):
                      return True
              return False

          named: list[str] = []

          def walk(entry: object) -> None:
              if isinstance(entry, str):
                  named.append((docs_dir / entry).as_posix())
              elif isinstance(entry, dict):
                  for value in entry.values():
                      walk(value)
              elif isinstance(entry, list):
                  for value in entry:
                      walk(value)

          walk(project.get("nav", []))
          orphans = [
              path.as_posix()
              for path in sorted(docs_dir.rglob("*.md"))
              if not excludes(path.relative_to(docs_dir).as_posix())
              and path.as_posix() not in named
          ]
          for orphan in orphans:
              problems.append(
                  f"{orphan} is published by the site but named by neither the nav "
                  "nor an exclude_docs rule"
              )

          for problem in problems:
              print(f"pages: {problem}", file=sys.stderr)
          if problems:
              print(
                  "pages: the site and its nav disagree; fix zensical.toml's nav",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"pages: {len(named)} nav pages, 0 orphan pages")
          PY
      - name: Install Zensical
        run: pipx install "zensical==$ZENSICAL_VERSION"
      # `--strict` aborts on a warning, and link validation is on by default:
      # every internal link and every link anchor is resolved, so a renamed
      # heading or a moved page fails this job.
      - name: Build the site with --strict
        run: zensical build --strict
      # The package's offline suites (`python/tests/test_check_pytest_gate.py`,
      # `test_launcher.py`) plus the `install.sh` POSIX-sh parse: no wheel, no
      # network, no root. This is the job that keeps them on a pull request now
      # that `ci.yml` runs no docs job.
      - name: The package's offline suites and install.sh's syntax
        run: make docs-unit
      # The hero's one command is served from the site root, so the served bytes
      # must be the reviewed bytes. The build happens to copy `docs/install.sh`
      # in this pinned Zensical, which is not a guarantee the gate can lean on:
      # the copy is explicit, `cmp` proves it, the HTTP GET proves what Pages will
      # hand a user, and the pipe proves a real `curl … | sh` still reaches
      # usage.
      #
      # Two version guards live beside it: `BLASTIT_DEFAULT_VERSION` must equal
      # `Cargo.toml`'s version, and the embedded digest table must be keyed by
      # that same constant (so a release has one version to bump). A row that is
      # still `-` is **not** a failure: `docs/install.sh` reads it as "verify this
      # archive against the release's own `SHA256SUMS` at install time"
      # (`embedded_sha256` -> `resolve_digest`), and the archives those digests
      # describe are built by `Publish` *after* the tag exists — so demanding
      # stamped rows on the tag path made every release tag red (`v0.2.0`
      # included). A tag run prints the notice instead of refusing.
      - name: Publish and prove install.sh (the README's one command)
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          pinned=$(sed -n 's/^BLASTIT_DEFAULT_VERSION="\(.*\)"/\1/p' docs/install.sh)
          if [ "$version" != "$pinned" ]; then
            echo "::error file=docs/install.sh::BLASTIT_DEFAULT_VERSION=$pinned but Cargo.toml says $version: bump the installer's default with the release"
            exit 1
          fi
          if ! grep -qF '"$BLASTIT_DEFAULT_VERSION":' docs/install.sh; then
            echo "::error file=docs/install.sh::the embedded digest table must be keyed by BLASTIT_DEFAULT_VERSION"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && grep -qE "printf '%s.n' - ;;" docs/install.sh; then
            echo "::notice file=docs/install.sh::$GITHUB_REF's embedded digest table still holds '-' rows: the installer verifies those archives against the release's own SHA256SUMS (resolve_digest), because the archives are built after the tag exists"
          fi
          cp docs/install.sh site/install.sh
          chmod 0755 site/install.sh
          cmp docs/install.sh site/install.sh
          uv run --no-project python -m http.server 8731 --bind 127.0.0.1 --directory site &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          url=http://127.0.0.1:8731/install.sh
          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null "$url" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::the built site does not serve /install.sh"
            exit 1
          fi
          curl -fsSL "$url" | cmp - docs/install.sh
          curl -fsSL "$url" | sh -s -- --help >/dev/null
          echo "install.sh: published for v$version, served byte-identical, and 'curl … | sh -s -- --help' exits 0"
      - uses: actions/configure-pages@v6
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy the site to GitHub Pages
    needs: build
    # A pull request builds the site and stops there: the `github-pages`
    # environment allows `develop` and `v*` only, so a deployment from a
    # feature branch would be refused.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
