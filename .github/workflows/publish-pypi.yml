name: Publish

# E4: the release path. Pushing a `v*` tag publishes the manylinux wheels and the
# sdist to PyPI through trusted publishing — OIDC, so there is no API token to
# leak or rotate — from a GitHub environment named `pypi`. Nothing is built
# before the tag has been checked against `Cargo.toml`, and nothing is uploaded
# before the description has been rendered the way PyPI renders it
# (`scripts/check-long-description.py`, in `verify`).
#
# A tag can't be rehearsed, so the same builds also run on two other events, and
# neither can publish a release:
#
#   * `workflow_dispatch` builds everything and stops before the upload. Uncheck
#     `dry-run` to send the very same files to TestPyPI, from the `testpypi`
#     environment — the dress rehearsal, with an index that takes throwaway
#     versions. `pypi` and `release` check `github.event_name` as well as
#     `github.ref_type`, so a dispatch on a tag cannot reach them;
#   * a pull request that touches the packaging itself (this file, the action,
#     pyproject.toml, scripts/, README.md — it is the long description) runs the
#     builds, so a broken sdist or a wheel without dbproxy is found before the
#     tag instead of during it.
#
# The development builds — the wheels every commit to `develop` builds, without
# publishing — are `.github/workflows/wheels.yml`, and they share
# `.github/actions/build-wheel` with this one, so the released wheel is the same
# one every commit already built.
#
# The one-time PyPI setup (trusted publisher, environments) is in RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify everything, upload nothing. Uncheck to publish to TestPyPI.
        type: boolean
        default: true
  pull_request:
    branches: [develop]
    paths:
      - "pyproject.toml"
      - "Cargo.toml"
      - "blastit_build.py"
      - "scripts/**"
      - "README.md"
      - ".github/actions/**"
      - ".github/workflows/publish-pypi.yml"

concurrency:
  group: publish-${{ github.ref }}
  # A tag run is left alone — it can be halfway through an upload. A rehearsal
  # (dispatch, pull request) is superseded by the next push, like CI.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  guard:
    name: the tag names a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only a tag can be wrong about the version it publishes: a dispatch or a
      # pull request rehearses the build, not a release.
      - name: Tag vs Cargo.toml
        if: github.ref_type == 'tag'
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - name: The changelog has an entry for it
        if: github.ref_type == 'tag'
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

  wheels:
    name: wheel (CPython ${{ matrix.python }})
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      # x86_64 only. arm64 is a step of its own, not a matrix dimension:
      # `blastit-sys` does not compile for aarch64 (`libc::SYS_fchmodat2` is not
      # defined there — run 40388835113 has the log), and §7.3's seccomp filters
      # and the arch check they run under are written for x86_64 and have never
      # run on arm64 at all. That needs an arm64 runner and a test run on it.
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      # `uvx` for the README rewrite. Pinned to a release tag rather than to a
      # major one: `astral-sh/setup-uv` stopped publishing major tags after `v7`.
      - uses: astral-sh/setup-uv@v10.3.2
      # Before the build: the README is the wheel's long description, and PyPI
      # renders it with no repository around it.
      - name: README links, as PyPI needs them
        run: uv run --no-project scripts/readme-absolute-links.py
      - uses: ./.github/actions/build-wheel
        with:
          python: ${{ matrix.python }}
          artifact: wheel-${{ matrix.python }}

  sdist:
    name: sdist
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      - name: README links, as PyPI needs them
        run: uv run --no-project scripts/readme-absolute-links.py
      # The sdist is what a platform without a wheel installs, so it has to build
      # a working wheel on its own — including the dbproxy binary, which the
      # build backend builds from the workspace in it (`blastit_build.py`).
      - name: Build the sdist
        run: uvx maturin sdist --out dist
      - name: Install from the sdist, in a fresh environment
        run: |
          set -euo pipefail
          uv venv --python 3.13 /tmp/from-sdist
          # `--no-cache`: this must build the sdist here and now, not reuse a
          # wheel some earlier run put in the cache.
          VIRTUAL_ENV=/tmp/from-sdist uv pip install --no-cache dist/blastit-*.tar.gz
      - name: The installed blastit runs, with dbproxy in it
        run: |
          set -euo pipefail
          # `--help` prints the usage and exits 0 (`cli::SUCCESS`); the words come
          # from `blastit._blastit`, so a wheel built from this sdist that doesn't
          # load fails here.
          usage=$(/tmp/from-sdist/bin/blastit --help)
          printf '%s\n' "$usage" | grep -q "stage 0"
          dbproxy=$(ls /tmp/from-sdist/lib/python3*/site-packages/blastit/_bin/blastit-dbproxy)
          test -x "$dbproxy"
          ls -l "$dbproxy"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  verify:
    name: description, as PyPI renders it
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.3.2
      # Every file that will be uploaded: the wheels and the sdist, nothing else.
      # The script renders the description with PyPI's own renderer, which
      # `twine check` does not do for Markdown (see RELEASING.md).
      - name: Every file that goes to PyPI
        run: |
          set -euo pipefail
          ls -l dist
          uv run --no-project scripts/check-long-description.py dist/*

  testpypi:
    name: TestPyPI
    needs: verify
    # A dispatch, and only with `dry-run` unchecked; a tag never goes here.
    if: github.event_name == 'workflow_dispatch' && !inputs.dry-run
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/blastit
    # Only the job that uploads gets a token to prove who it is.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal runs the same version again after a fix; without this,
          # the second one stops on the files the first one uploaded.
          skip-existing: true

  pypi:
    name: PyPI
    needs: verify
    # The event is part of the guard, not only the ref type: a
    # `workflow_dispatch` can name a tag as its ref, and GitHub reports
    # `ref_type == 'tag'` for that too. Without `event_name`, dispatching this
    # workflow on `v0.1.0` would publish to the real PyPI — the one thing the
    # dispatch path must never be able to do.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/blastit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Attestations are on by default in this action: PyPI records, for every
      # file, that these workflows built it from this commit.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI refuses a file it already has, and never replaces one. This
          # only skips those: re-running a half-failed upload finishes it
          # instead of spending the version number again.
          skip-existing: true

  release:
    name: GitHub release
    needs: pypi
    # Same guard as `pypi`: a release follows a publish, and a dispatch must
    # not be able to create one either.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the wheels and the sdist to the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The notes are the changelog entry the guard already found.
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              # A re-run of a failed publish: the release is there already.
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
              gh release create "$GITHUB_REF_NAME" dist/* \
                --verify-tag \
                --title "blastit $GITHUB_REF_NAME" \
                --notes-file notes.md
          fi
