name: Publish

# E4: the PR-driven release path.
#
# A release starts as a `release/<version>` pull request into `develop` (opened by
# the autonomous conductor once a milestone or sub-release gate passes). On the PR,
# this workflow rehearses the entire release: `guard` checks that the branch name,
# `Cargo.toml` version, and dated `CHANGELOG.md` entry agree and that `v<version>`
# does not exist yet, then `wheels`, `sdist`, and `verify` (`check-long-description.py`)
# prove every distribution builds, installs, and renders cleanly on PyPI.
#
# When a human reviews and merges that PR into `develop`:
#   1. `guard` sees that `[workspace.package] version` in `Cargo.toml` has no
#      `v<version>` tag yet and activates the release path (an ordinary merge onto
#      `develop` whose version is already tagged exits cleanly in seconds);
#   2. `wheels`, `sdist`, and `verify` build and verify the exact release artifacts
#      with README links pinned to `v<version>`, while `validate` waits in parallel
#      for `CI`, `Docs`, and `Live (DigitalOcean)` on that merged `develop` commit
#      to pass green;
#   3. `pypi` publishes the wheels and sdist to PyPI via OIDC trusted publishing
#      from the `pypi` GitHub environment;
#   4. `release` creates and pushes the annotated `v<version>` git tag on the
#      validated commit and publishes the GitHub Release with artifacts and the
#      `CHANGELOG.md` notes attached.
#
# Two manual paths remain:
#   * `workflow_dispatch` rehearses the build (and with `dry-run` unchecked uploads
#     to TestPyPI from `testpypi`) — `pypi` and `release` refuse `workflow_dispatch`
#     even when dispatched on a tag;
#   * pushing an explicit `v*` tag still works as an idempotent manual fallback.
#
# The one-time PyPI setup (trusted publisher, environments) is in RELEASING.md.

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify everything, upload nothing. Uncheck to publish to TestPyPI.
        type: boolean
        default: true
  pull_request:
    branches: [develop]
    paths:
      - "pyproject.toml"
      - "Cargo.toml"
      - "CHANGELOG.md"
      - "blastit_build.py"
      - "scripts/**"
      - "README.md"
      - ".github/actions/**"
      - ".github/workflows/publish-pypi.yml"

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a run on `develop` or a `v*` tag — either can be halfway through
  # an upload, and queuing serialises back-to-back pushes to `develop` so the
  # second sees the tag the first just created. Rehearsals (PR, dispatch) cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  guard:
    name: release guard
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      ref_for_links: ${{ steps.plan.outputs.ref_for_links }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all tags from origin
        run: git fetch --tags --force origin
      - name: Decide mode and check release invariants
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_FULL: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          version=$(awk '
              /^\[workspace\.package\]/ { inside = 1; next }
              /^\[/ { inside = 0 }
              inside && /^version = "/ { sub(/^version = "/, ""); sub(/"$/, ""); print; exit }
          ' Cargo.toml)
          if [[ -z $version ]]; then
              echo "::error::no [workspace.package] version in Cargo.toml"
              exit 1
          fi
          tag="v$version"

          if [[ $EVENT_NAME == "push" && $REF_TYPE == "tag" ]]; then
              scripts/check-release-tag.sh "$REF_NAME"
              scripts/release-notes.sh --require-dated "$REF_NAME" > /dev/null
              {
                  echo "should_build=true"
                  echo "release=true"
                  echo "tag=$REF_NAME"
                  echo "version=${REF_NAME#v}"
                  echo "ref_for_links=$REF_NAME"
              } >> "$GITHUB_OUTPUT"
              echo "Tag push $REF_NAME: verified against Cargo.toml and CHANGELOG.md."
          elif [[ $EVENT_NAME == "push" && $REF_FULL == "refs/heads/develop" ]]; then
              scripts/check-release-tag.sh "$tag"
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                  {
                      echo "should_build=false"
                      echo "release=false"
                      echo "tag=$tag"
                      echo "version=$version"
                      echo "ref_for_links=develop"
                  } >> "$GITHUB_OUTPUT"
                  echo "$tag is already tagged; skipping release pipeline on this develop push."
              else
                  scripts/release-notes.sh --require-dated "$tag" > /dev/null
                  {
                      echo "should_build=true"
                      echo "release=true"
                      echo "tag=$tag"
                      echo "version=$version"
                      echo "ref_for_links=$tag"
                  } >> "$GITHUB_OUTPUT"
                  echo "New release $tag landed on develop: validating CI/Docs/Live and publishing."
              fi
          else
              scripts/check-release-tag.sh "$tag"
              if [[ $EVENT_NAME == "pull_request" && $HEAD_REF == release/* ]]; then
                  expected_branch="release/$version"
                  if [[ $HEAD_REF != "$expected_branch" ]]; then
                      echo "::error::release branch is \`$HEAD_REF\`, but Cargo.toml version is \`$version\` (expected branch \`$expected_branch\`)"
                      exit 1
                  fi
                  if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                      echo "::error::tag \`$tag\` already exists: bump [workspace.package] version in Cargo.toml before opening a release PR"
                      exit 1
                  fi
                  scripts/release-notes.sh --require-dated "$tag" > /dev/null
                  echo "Release PR $HEAD_REF -> develop: version $version, dated changelog entry, and unused tag $tag verified."
              fi
              {
                  echo "should_build=true"
                  echo "release=false"
                  echo "tag=$tag"
                  echo "version=$version"
                  echo "ref_for_links=develop"
              } >> "$GITHUB_OUTPUT"
          fi

  wheels:
    name: wheel (CPython ${{ matrix.python }})
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      # x86_64 only. arm64 is a step of its own, not a matrix dimension:
      # `blastit-sys` does not compile for aarch64 (`libc::SYS_fchmodat2` is not
      # defined there — run 40388835113 has the log), and §7.3's seccomp filters
      # and the arch check they run under are written for x86_64 and have never
      # run on arm64 at all. That needs an arm64 runner and a test run on it.
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      # `uvx` for the README rewrite. Pinned to a release tag rather than to a
      # major one: `astral-sh/setup-uv` stopped publishing major tags after `v7`.
      - uses: astral-sh/setup-uv@v10.3.2
      # Before the build: the README is the wheel's long description, and PyPI
      # renders it with no repository around it.
      - name: README links, as PyPI needs them
        env:
          LINK_REF: ${{ needs.guard.outputs.ref_for_links }}
        run: uv run --no-project scripts/readme-absolute-links.py --ref "$LINK_REF"
      - uses: ./.github/actions/build-wheel
        with:
          python: ${{ matrix.python }}
          artifact: wheel-${{ matrix.python }}

  sdist:
    name: sdist
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      - name: README links, as PyPI needs them
        env:
          LINK_REF: ${{ needs.guard.outputs.ref_for_links }}
        run: uv run --no-project scripts/readme-absolute-links.py --ref "$LINK_REF"
      # The sdist is what a platform without a wheel installs, so it has to build
      # a working wheel on its own — including the dbproxy binary, which the
      # build backend builds from the workspace in it (`blastit_build.py`).
      - name: Build the sdist
        run: uvx maturin sdist --out dist
      - name: Install from the sdist, in a fresh environment
        run: |
          set -euo pipefail
          uv venv --python 3.13 /tmp/from-sdist
          # `--no-cache`: this must build the sdist here and now, not reuse a
          # wheel some earlier run put in the cache.
          VIRTUAL_ENV=/tmp/from-sdist uv pip install --no-cache dist/blastit-*.tar.gz
      - name: The installed blastit runs, with dbproxy in it
        run: |
          set -euo pipefail
          # `--help` prints the usage and exits 0 (`cli::SUCCESS`); the words come
          # from `blastit._blastit`, so a wheel built from this sdist that doesn't
          # load fails here.
          usage=$(/tmp/from-sdist/bin/blastit --help)
          printf '%s\n' "$usage" | grep -q "stage 0"
          dbproxy=$(ls /tmp/from-sdist/lib/python3*/site-packages/blastit/_bin/blastit-dbproxy)
          test -x "$dbproxy"
          ls -l "$dbproxy"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  verify:
    name: description, as PyPI renders it
    needs: [guard, wheels, sdist]
    if: needs.guard.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.3.2
      # Every file that will be uploaded: the wheels and the sdist, nothing else.
      # The script renders the description with PyPI's own renderer, which
      # `twine check` does not do for Markdown (see RELEASING.md).
      - name: Every file that goes to PyPI
        run: |
          set -euo pipefail
          ls -l dist
          uv run --no-project scripts/check-long-description.py dist/*

  validate:
    name: CI, Docs & Live green on develop
    needs: guard
    if: needs.guard.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI, Docs, and Live (DigitalOcean) on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time

          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          required = {
              ".github/workflows/ci.yml": "CI",
              ".github/workflows/docs.yml": "Docs",
              ".github/workflows/live.yml": "Live (DigitalOcean)",
          }

          # Give GitHub Actions a moment to register all sibling `push` workflows.
          time.sleep(15)
          started = time.monotonic()

          while True:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "api",
                      f"repos/{repo}/actions/runs?head_sha={sha}&event=push&per_page=50",
                  ],
                  text=True,
              )
              runs = json.loads(raw).get("workflow_runs", [])
              latest: dict[str, dict] = {}
              for run in runs:
                  path = run.get("path")
                  if path not in required or run.get("head_branch") != "develop":
                      continue
                  if path not in latest or int(run["id"]) > int(latest[path]["id"]):
                      latest[path] = run

              elapsed = int(time.monotonic() - started)
              missing = [label for path, label in required.items() if path not in latest]
              if missing and elapsed > 180:
                  print(
                      f"::error::workflow run(s) not found on develop@{sha[:7]} after {elapsed}s: "
                      + ", ".join(missing),
                      file=sys.stderr,
                  )
                  sys.exit(1)

              failures = []
              pending = list(missing)
              summary = []
              for path, label in required.items():
                  run = latest.get(path)
                  if run is None:
                      summary.append(f"{label}=waiting-to-register")
                      continue
                  status = run.get("status")
                  conclusion = run.get("conclusion")
                  url = run.get("html_url", "")
                  summary.append(f"{label}={conclusion or status}")
                  if status != "completed":
                      pending.append(label)
                  elif conclusion != "success":
                      failures.append(f"{label} ({conclusion}): {url}")

              print(f"[{elapsed:>4}s] " + " | ".join(summary), flush=True)
              if failures:
                  for item in failures:
                      print(f"::error::validation failed on develop@{sha[:7]}: {item}", file=sys.stderr)
                  sys.exit(1)
              if not pending:
                  print(f"All validation workflows succeeded on develop@{sha[:7]}.")
                  break
              time.sleep(20)
          PY

  testpypi:
    name: TestPyPI
    needs: [guard, verify]
    # A dispatch, and only with `dry-run` unchecked; a release never goes here.
    if: github.event_name == 'workflow_dispatch' && !inputs.dry-run && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/blastit
    # Only the job that uploads gets a token to prove who it is.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal runs the same version again after a fix; without this,
          # the second one stops on the files the first one uploaded.
          skip-existing: true

  pypi:
    name: PyPI
    needs: [guard, verify, validate]
    # `event_name == 'push'` is mandatory: `workflow_dispatch` can target `develop`
    # or a tag ref, and must never reach real PyPI. On `develop`, `validate` must
    # have succeeded; on a manual `v*` tag push, `validate` is skipped.
    if: >-
      !cancelled() &&
      needs.guard.result == 'success' &&
      needs.guard.outputs.release == 'true' &&
      needs.verify.result == 'success' &&
      github.event_name == 'push' &&
      (
        (github.ref == 'refs/heads/develop' && needs.validate.result == 'success') ||
        (github.ref_type == 'tag' && needs.validate.result == 'skipped')
      )
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/blastit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Attestations are on by default in this action: PyPI records, for every
      # file, that these workflows built it from this commit.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI refuses a file it already has, and never replaces one. This
          # only skips those: re-running a half-failed upload finishes it
          # instead of spending the version number again.
          skip-existing: true

  release:
    name: tag & GitHub release
    needs: [guard, pypi]
    if: >-
      !cancelled() &&
      needs.guard.result == 'success' &&
      needs.guard.outputs.release == 'true' &&
      needs.pypi.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create git tag (if needed) and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              tagged_sha=$(git rev-list -n 1 "$RELEASE_TAG")
              if [[ $tagged_sha != "$TARGET_SHA" ]]; then
                  echo "::error::tag $RELEASE_TAG already points to $tagged_sha, not $TARGET_SHA"
                  exit 1
              fi
              echo "Tag $RELEASE_TAG already exists at $TARGET_SHA."
          else
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "blastit $RELEASE_VERSION"
              git push origin "refs/tags/$RELEASE_TAG"
              echo "Created and pushed annotated tag $RELEASE_TAG -> $TARGET_SHA."
          fi

          # The notes are the changelog entry the guard already found.
          scripts/release-notes.sh "$RELEASE_TAG" > notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              # A re-run of a failed publish: the release is there already.
              gh release upload "$RELEASE_TAG" dist/* --clobber
          else
              gh release create "$RELEASE_TAG" dist/* \
                --verify-tag \
                --title "blastit $RELEASE_TAG" \
                --notes-file notes.md
          fi
