# The real proof for the per-minor CPython shims (`MB.42.2`, `MB.42.3.3`) and for
# the WSGI story they carry (`TESTING_PLAN.md` §2).
#
# `make check` builds the shims this host can build and asserts their ELF
# contract, but it cannot prove every leg: it has one interpreter per minor and
# one libc, and it says so by printing the minors it skipped. This workflow is
# the acceptance that counts, and it runs **once per leg** —
# `scripts/platform_matrix.py --matrix py-shims` is the list, so a leg is added in
# one place and appears here, in the wheel/archive bundles and in the counts the
# documentation is allowed to state.
#
# Each leg builds `libblastit_py3<minor>-<arch>-<libc>.so` natively, with a
# CPython of exactly that minor, and then asserts the four properties the frozen
# ABI depends on — on the **artifact**, not on the flags the build was asked for:
#
#   * `nm -D --defined-only` carries the three exports (`blastit_py_abi_version`,
#     `blastit_py_minor`, `blastit_py_abi_v1`): the version handshake stage 1
#     reads before it calls anything;
#   * `readelf -d` reports `DT_SONAME` equal to the file name, because the loader
#     looks the shim up by that name;
#   * `nm -uD` leaves `Py_InitializeEx` **undefined**: the host interpreter's
#     symbols are resolved at `dlopen`, and a shim that linked its own libpython
#     would be a second interpreter in the worker (`R1`);
#   * `readelf -d` carries no `NEEDED libpython*`, and
#     `scripts/check-portable-elf.sh` passes with no relaxation: zero libpython,
#     zero libphp, no build-host `RUNPATH`.
#
# `make py-sapi` already runs those four assertions for
# every minor it builds; the explicit block here is what makes this job's log a
# *proof line per leg* rather than "the target exited 0", and it is what fails
# when `make py-sapi` is refactored into something weaker.
#
# The `wsgi` job is the boot-level half: Django and Flask on **CPython 3.13 and
# 3.14**, serving their views through these shims, with per-view SQL grants and
# the five refusals (`e2e/run_apps.py --legs wsgi`). The minors it installs and
# the runner it uses come from the matrix, so a newly declared minor is a leg
# here before it is a promise in the docs.
#
# Kept out of `make check` (Docker-free but needs several interpreters), exactly
# like `php-sapi.yml`, so the shim cannot rot unnoticed between gates.
name: Python SAPI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: py-sapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  matrix:
    name: the leg list (scripts/platform_matrix.py)
    runs-on: ubuntu-latest
    outputs:
      py_shims: ${{ steps.legs.outputs.py_shims }}
      wsgi_host: ${{ steps.legs.outputs.wsgi_host }}
      minors: ${{ steps.legs.outputs.minors }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      # A broken matrix fails here, once, before any interpreter is installed.
      - name: The matrix and the published counts agree
        run: uv run --no-project scripts/platform_matrix.py --check
      - id: legs
        run: |
          set -euo pipefail
          echo "py_shims=$(uv run --no-project scripts/platform_matrix.py --matrix py-shims)" >> "$GITHUB_OUTPUT"
          # The WSGI story runs on a host, not in a container: the architecture
          # whose native runner carries it and the minors a shim exists for are
          # both the matrix's.
          echo "wsgi_host=$(uv run --no-project scripts/platform_matrix.py --matrix hosts --arch x86_64 |
              uv run --no-project python -c 'import json, sys; print(json.load(sys.stdin)["include"][0]["runs_on"])')" >> "$GITHUB_OUTPUT"
          minors=$(uv run --no-project scripts/platform_matrix.py --matrix py-shims |
              uv run --no-project python -c 'import json, sys; print(" ".join(sorted({item["python"] for item in json.load(sys.stdin)["include"]})))')
          echo "minors=$minors" >> "$GITHUB_OUTPUT"

  lint:
    name: 'lint: the shim crates, fmt + clippy -D warnings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: The matrix and the published counts agree
        run: uv run --no-project scripts/platform_matrix.py --check
      - name: fmt + clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy -p blastit-py-shim --features extension-module --all-targets --locked -- -D warnings

  legs:
    name: '§2 CPython ${{ matrix.minor }} shim (${{ matrix.arch }}-${{ matrix.libc }})'
    needs: [lint, matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.py_shims) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      # The leg is `bash scripts/py_sapi_leg.sh`, which runs `make py-sapi`:
      # it needs cargo and a warm `target/` on the runner.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # **The leg's own builder image.** `matrix.builder_image` comes from
      # `scripts/platform_matrix.py`: a musl shim is compiled inside
      # `alpine:3.21`, because no `--target` makes a glibc linker emit a musl
      # binary — the review found `libblastit_py313-x86_64-musl.so` linked
      # against `libc.so.6`, and every assertion below passed anyway. The script
      # also asserts the artifact's `NEEDED` line against the leg's libc, which
      # is the assertion that catches it.
      - name: 'shim + contract (CPython ${{ matrix.minor }}, ${{ matrix.arch }}-${{ matrix.libc }})'
        run: >-
          bash scripts/py_sapi_leg.sh
          --minor ${{ matrix.minor }} --arch ${{ matrix.arch }} --libc ${{ matrix.libc }}
          --out target/py-sapi
          ${{ matrix.builder_image != '' && format('--image {0}', matrix.builder_image) || '' }}
      - name: the proof lines this job owes (log, not just an exit status)
        run: |
          set -euo pipefail
          shim="target/py-sapi/${{ matrix.shim }}"
          test -f "$shim"
          {
            echo "### ${{ matrix.shim }}"
            readelf -d "$shim" | sed -n 's/.*(SONAME).*/&/p'
            nm -D --defined-only "$shim" | awk '$2 == "T" && $3 ~ /^blastit_py_/ { print "exported: " $2 " " $3 }'
            nm -uD "$shim" | grep -E ' Py_Initialize(Ex|FromConfig)$' | sed 's/^/undefined:/'
            echo "NEEDED: $(readelf -d "$shim" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
      # Built *and* asserted is the release bar: the shim leaves with the name the
      # bundle and the wheel embed, and the publish pipeline ships that file.
      - uses: actions/upload-artifact@v4
        with:
          name: py-shim-${{ matrix.name }}
          path: target/py-sapi/${{ matrix.shim }}
          if-no-files-found: error

  # `TESTING_PLAN.md` §2's WSGI story: Django and Flask on CPython 3.13 **and**
  # 3.14, each view executing only its declared statements, the same five
  # refusals answering `403`/`42501`, and no database password in any worker
  # environment or response. The PHP and static legs of the same driver belong
  # to `ci.yml`; this job runs one family so its log is the WSGI proof.
  wsgi:
    name: '§2 WSGI views: Django & Flask on CPython ${{ needs.matrix.outputs.minors }}'
    needs: [matrix, legs]
    runs-on: ${{ needs.matrix.outputs.wsgi_host }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the CPython minors the matrix names
        run: uv python install ${{ needs.matrix.outputs.minors }}
      - name: Build the per-minor CPython shims (fails closed)
        run: make python-runtime
      - name: Build the binary under test
        run: cargo build -p blastit --release --locked
      - name: Run the WSGI family (e2e/run_apps.py --legs wsgi)
        run: |
          set -o pipefail
          uv run --no-project e2e/run_apps.py --legs wsgi 2>&1 | tee "$RUNNER_TEMP/wsgi.log"
      # A missing interpreter or shim prints a `SKIP` and exits 0, so a green job
      # would prove nothing. The printout is the verdict: every minor's two
      # frameworks PASS, and nothing in this family skipped.
      - name: 'guard: both WSGI frameworks serve on every minor, none skipped'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wsgi.log"
          status=0
          if skipped=$(grep -nE '^SKIP ' "$log"); then
            echo "::error::the WSGI legs skipped instead of serving: this runner has no interpreter or shim for a minor the matrix declares"
            echo "$skipped"
            status=1
          fi
          for evidence in 'PASS  django 3\.13 ' 'PASS  flask 3\.13 ' 'PASS  django 3\.14 ' 'PASS  flask 3\.14 '; do
            if ! grep -qE "$evidence" "$log"; then
              echo "::error::the WSGI proof line is missing from the run: $evidence"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "--- $log (tail) ---"
            tail -n 60 "$log"
            exit 1
          fi
          echo "the WSGI legs served: $(grep -cE '^PASS  (django|flask) ' "$log") framework leg(s)"
