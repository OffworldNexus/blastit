name: Build a wheel
description: >
  Build one blastit wheel in manylinux_2_28 — the extension, the Python package,
  and the Python-free `blastit-dbproxy` binary the wheel carries (§4, D2) — and
  upload it as an artifact.

  `scripts/build-wheel.sh` does the same thing on a developer's machine; the
  container is what makes the wheel work on an older glibc than the runner's, so
  CI builds in there. Both the development wheels
  (`.github/workflows/wheels.yml`) and the published ones
  (`.github/workflows/publish-pypi.yml`) come from here, so the released wheel is
  the one every commit to `develop` already built and smoked.

inputs:
  python:
    description: CPython version to build for, as maturin's `--interpreter` takes it (`3.13`)
    required: true
  artifact:
    description: Name to upload the wheel under
    required: true
  manylinux:
    description: manylinux tag to build in
    required: false
    default: "2_28"
  platform:
    description: >
      The wheel tag the leg promises (`manylinux_2_28`, `musllinux_1_2`), from
      `scripts/platform_matrix.py`. The built file must carry exactly this
      prefix: a wheel built for one libc and named for the other installs and
      then fails at `import`, which is the failure mode a matrix produces when
      it grows a leg nobody checked.
    required: false
    default: "manylinux_2_28"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Build in manylinux_2_28
      uses: PyO3/maturin-action@v1
      with:
        manylinux: ${{ inputs.manylinux }}
        # Both capabilities are named here, not inherited by accident: the wheel
        # is `python, php` (`ADR-0010` §4), and `blastit-py`'s dependency on
        # `blastit` enables `python` today only because that manifest says so
        # (`crates/blastit-py/Cargo.toml`). Passing `blastit/python` here too
        # means a future reshuffle of that dependency — or a `--no-default-features`
        # flag — cannot silently produce a wheel whose extension loads no
        # interpreter, which would refuse every WSGI route at Stage 0.
        args: --release --out dist --interpreter python${{ inputs.python }} --compatibility ${{ inputs.platform }} --features blastit-py/extension-module,blastit/python
        # Inside the container, so the Python-free dbproxy binary the wheel
        # carries is built against the same old glibc as the extension.
        before-script-linux: |
          dnf install -y --setopt=install_weak_deps=False clang && dnf clean all
          cargo build --release --locked -p blastit-dbproxy --bin blastit-dbproxy
          install -D -m 0755 target/release/blastit-dbproxy python/blastit/_bin/blastit-dbproxy
    - name: The wheel's tag is the platform this leg promised (and never above manylinux_2_28)
      shell: bash
      run: |
        set -euo pipefail
        for wheel in dist/*.whl; do
            unzip -p "$wheel" '*.dist-info/WHEEL' | grep '^Tag:'
        done
        python3 scripts/check_wheel_tag.py \
            --max-glibc 2_28 \
            --platform "${{ inputs.platform }}" \
            dist/*.whl

    - name: The wheel carries dbproxy, executable
      shell: bash
      run: |
        set -euo pipefail
        for wheel in dist/*.whl; do
            # A wheel is a zip and the file name is stored uncompressed, so
            # finding it needs no tool; the mode lives in the zip's attributes,
            # which is what `zipinfo -l` prints in its first column.
            if ! grep -qa "blastit/_bin/blastit-dbproxy" "$wheel"; then
                echo "$wheel has no dbproxy binary in it: blastit refuses to start without it" >&2
                exit 1
            fi
            if ! zipinfo -l "$wheel" | awk '{ print $1, $NF }' | grep -qx -- "-..x..x..x blastit/_bin/blastit-dbproxy"; then
                echo "dbproxy is not executable in $wheel" >&2
                exit 1
            fi
            echo "$wheel ok"
        done
    # Installed and smoked here, in a bare CPython image, for every leg: a wheel
    # whose `cp3NN` tag does not match what it can load, or one that lost the
    # dbproxy binary on the way out of the container, is caught on the commit
    # that built it and again on the tag that publishes it (`MB.3.18`,
    # acceptance 1). The image follows the wheel's own tag: a non-abi3 wheel's
    # tag *is* the interpreter it needs.
    - name: Install the wheel and serve one static route (bare CPython image)
      shell: bash
      run: |
        set -euo pipefail
        for wheel in dist/*.whl; do
            tag=$(basename "$wheel" | grep -oE 'cp3[0-9]+' | head -1)
            py="${tag#cp}"
            python="${py:0:1}.${py:1}"
            echo "wheel-smoke: $(basename "$wheel") on python:${python}-slim"
            docker run --rm \
                -v "$PWD/dist:/dist:ro" -v "$PWD:/src:ro" \
                "python:${python}-slim" \
                bash /src/scripts/wheel-smoke.sh "/dist/$(basename "$wheel")"
        done

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: dist/*.whl
        if-no-files-found: error
