name: Build a wheel
description: >
  Build one universal `py3-none-<platform>` blastit wheel with
  `scripts/build-wheel.sh` and upload it as an artifact.

  **`scripts/build-wheel.sh` is the build** (`MB.42.3.3`). This action used to run
  `maturin-action` directly with `--features blastit-py/extension-module`, a crate
  `MB.42.2.2.2` deleted: that step failed with *the package `blastit` does not
  contain this feature*, and had it built it would have produced a `cp3NN`
  extension wheel — while `wheels.yml` and `publish-pypi.yml` upload and count
  `py3-none` wheels, so the release published zero of four. The script builds
  `maturin build --bindings bin` inside the manylinux container, repacks the result
  (`scripts/repack_universal_wheel.py`), checks the tag and measures **every**
  embedded ELF (`check-portable-elf.sh`, `check-no-test-shim.sh`), so the action is
  a thin, honest caller: one place builds a wheel, on a developer's machine and in
  CI alike.

  A wheel this action builds carries the two CPython shims the builder image can
  compile. The four PHP shims need a distro's `php_config.h`, so they only travel
  when a caller stages them (`shims-from:`); `publish-pypi.yml` is that caller —
  its wheel legs download the `shim-*` artifacts and pass `require-shims: all`,
  which fails closed when six are not there. `wheels.yml` has no shim legs and
  keeps the default `py` promise.

inputs:
  artifact:
    description: Name to upload the wheel under
    required: true
  manylinux:
    description: >
      manylinux tag to build in (`2_28`). It selects
      `quay.io/pypa/manylinux_<tag>_<arch>`; the wheel's platform tag is read back
      from the built wheel (`scripts/build-wheel.sh` refuses a promise that
      disagrees with it).
    required: false
    default: "2_28"
  platform:
    description: >
      The platform tag the leg promises (`manylinux_2_28`), from
      `scripts/platform_matrix.py`. `scripts/build-wheel.sh` refuses a wheel whose
      own `Tag:` disagrees, and `scripts/check_wheel_tag.py` rejects one above the
      manylinux floor.
    required: false
    default: "manylinux_2_28"
  require-shims:
    description: >
      `py` (the two CPython shims the builder image compiles) or `all` (those plus
      the four PHP shims a caller staged with `shims-from:`). `scripts/build-wheel.sh`
      fails closed when the count is short.
    required: false
    default: "py"
  shims-from:
    description: >
      Directory holding PHP shims a previous job built (the `shim-*` artifacts of
      `.github/workflows/php-sapi.yml`, or of `publish-pypi.yml`'s `shims` job).
      Empty when there are none: no PHP headers exist in the wheel builder, so
      this is the only way a wheel carries them.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    # Refused here rather than built on the runner: a host build would carry the
    # runner's glibc tag, and `--max-glibc 2_28` would reject it after the compile.
    - name: Refuse a wheel with no manylinux container
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${{ inputs.manylinux }}" ]; then
          echo "::error::build-wheel needs a non-empty \`manylinux:\`: scripts/build-wheel.sh builds inside quay.io/pypa/manylinux_<tag>_<arch>, and that image is the wheel's platform tag."
          exit 1
        fi
        echo "building in quay.io/pypa/manylinux_${{ inputs.manylinux }}_<arch>; the platform tag is manylinux_${{ inputs.manylinux }}"
    - name: Build the universal wheel (scripts/build-wheel.sh)
      shell: bash
      run: |
        set -euo pipefail
        extra=()
        if [ -n "${{ inputs.shims-from }}" ]; then
            extra+=(--shims-from "${{ inputs.shims-from }}")
        fi
        bash scripts/build-wheel.sh \
            --manylinux "${{ inputs.manylinux }}" \
            --require-shims "${{ inputs.require-shims }}" \
            "${extra[@]}" \
            --out dist
    - name: The wheel's tag is the platform this leg promised (and never above manylinux_2_28)
      shell: bash
      run: |
        set -euo pipefail
        for wheel in dist/*-py3-none-*.whl; do
            unzip -p "$wheel" '*.dist-info/WHEEL' | grep '^Tag:'
            unzip -p "$wheel" '*.dist-info/WHEEL' | grep -qx 'Root-Is-Purelib: false'
        done
        python3 scripts/check_wheel_tag.py \
            --max-glibc "${{ inputs.manylinux }}" \
            --platform "${{ inputs.platform }}" \
            dist/*-py3-none-*.whl

    - name: The wheel carries one program, executable
      shell: bash
      run: |
        set -euo pipefail
        for wheel in dist/*-py3-none-*.whl; do
            # A wheel is a zip and the file name is stored uncompressed, so
            # finding it needs no tool; the mode lives in the zip's attributes,
            # which is what `zipinfo -l` prints in its first column. The repack
            # writes `0100755`, so the file type is `-` and the bits are `rwxr-xr-x`.
            if ! zipinfo -l "$wheel" | awk '{ print $1, $NF }' | grep -qx -- "-rwxr-xr-x blastit/_bin/blastit"; then
                echo "::error::the universal blastit binary is not executable in $wheel"
                zipinfo -l "$wheel" | grep 'blastit/_bin/blastit' || true
                exit 1
            fi
            # One ELF runs every role: the credentials-holding one is that same
            # program as --role=dbproxy, so a second program in _bin/ is a bundle
            # that ships an image nobody builds.
            if grep -qa "blastit/_bin/blastit-dbproxy" "$wheel"; then
                echo "::error::$wheel ships a second program: one ELF runs every role"
                exit 1
            fi
            echo "$wheel ok"
        done
    # `MB.45`: the promise has to be a fact about the **wheel**, not about the
    # staging directory `scripts/build-wheel.sh` checked before the repack. The
    # check lives in `scripts/check_wheel_shims.py`, so the same proof runs here
    # and in `publish-pypi.yml`'s `verify` over both libcs. A `manylinux` wheel is
    # a `gnu` wheel, so its shims are asserted to be this wheel's own tuple.
    - name: The wheel carries the shims it promised
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/check_wheel_shims.py \
            --require "${{ inputs.require-shims }}" \
            --libc gnu \
            dist/*-py3-none-*.whl
    # One wheel, three interpreters — the promise a `py3-none` tag makes. Every
    # leg runs the same three images, so a wheel that loads on 3.13 and not on
    # 3.12 fails on the commit that built it (`scripts/wheel_container_smoke.sh`
    # takes the images from `scripts/platform_matrix.py`'s leg).
    - name: Install the wheel in python:3.12/3.13/3.14 and drive it
      shell: bash
      run: bash scripts/wheel_container_smoke.sh dist
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: dist/*-py3-none-*.whl
        if-no-files-found: error
